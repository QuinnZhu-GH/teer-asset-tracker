<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TEER模拟器资产管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
    background: #f0f2f5;
    color: #1a202c;
    min-height: 100vh;
  }
  .page { display: none; }
  .page.active { display: block; }

  /* ===== 汇报风格全局 ===== */
  .report-header {
    color: white; padding: 24px 20px 20px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .report-header.cat-t-teer { background: linear-gradient(135deg, #0f2b44 0%, #1e5a8a 50%, #2d6a9f 100%); }
  .report-header.cat-m-teer { background: linear-gradient(135deg, #3d0f24 0%, #7a2248 50%, #9f2d6a 100%); }
  .report-header .rh-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .report-header .rh-title { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
  .report-header .rh-date { font-size: 12px; opacity: 0.7; margin-top: 4px; }
  .report-header .rh-badge {
    background: rgba(255,255,255,0.2); backdrop-filter: blur(10px);
    padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
  }

  /* 汇报统计条 */
  .report-stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px; padding: 16px 16px 8px;
  }
  .r-stat {
    background: white; border-radius: 12px; padding: 14px 10px;
    text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .r-stat .r-num { font-size: 26px; font-weight: 800; line-height: 1.1; }
  .r-stat .r-label { font-size: 11px; color: #718096; margin-top: 4px; font-weight: 500; }
  .r-stat .r-icon { font-size: 18px; margin-bottom: 4px; }

  /* 地理分布条 */
  .geo-bar {
    background: white; border-radius: 14px; margin: 10px 16px;
    padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .geo-bar h3 { font-size: 13px; color: #718096; font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .geo-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .geo-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 600;
  }
  .geo-chip .geo-count { background: rgba(255,255,255,0.6); border-radius: 4px; padding: 1px 5px; font-size: 11px; }

  /* 设备卡片 - 汇报风格 */
  .device-list { padding: 8px 16px 24px; }
  .device-card {
    background: white; border-radius: 14px;
    padding: 0; margin-bottom: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    overflow: hidden; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .device-card:active { transform: scale(0.985); }
  .dc-top { display: flex; align-items: center; padding: 14px 16px 10px; gap: 12px; }
  .dc-icon {
    width: 48px; height: 48px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; flex-shrink: 0;
  }
  .cat-t-teer .dc-icon { background: linear-gradient(135deg, #ebf8ff, #bee3f8); }
  .cat-m-teer .dc-icon { background: linear-gradient(135deg, #fce7f3, #fbb6ce); }
  .dc-info { flex: 1; min-width: 0; }
  .dc-name { font-size: 16px; font-weight: 700; color: #1a202c; }
  .dc-id { font-size: 12px; color: #a0aec0; margin-top: 1px; }
  .dc-status-pill {
    padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
    white-space: nowrap; flex-shrink: 0;
  }
  .pill-ok { background: #f0fff4; color: #276749; }
  .pill-warn { background: #fffaf0; color: #c05621; }
  .pill-error { background: #fff5f5; color: #c53030; }
  .pill-unchecked { background: #f7fafc; color: #718096; }

  /* 卡片信息区 */
  .dc-meta { padding: 0 16px 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .dc-tag {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 500;
    background: #f7fafc; color: #4a5568;
  }
  .dc-tag.loc { background: #ebf8ff; color: #2b6cb0; }
  .dc-tag.owner { background: #fefcbf; color: #975a16; }
  .dc-tag.shipping { background: #faf5ff; color: #6b46c1; }
  .dc-tag.repair { background: #fff5f5; color: #c53030; }

  /* 卡片：器件状态快览 */
  .dc-components {
    display: flex; gap: 0; padding: 0 16px 10px;
  }
  .dc-comp {
    flex: 1; text-align: center; padding: 6px 2px;
    border-right: 1px solid #f0f4f8;
  }
  .dc-comp:last-child { border-right: none; }
  .dc-comp .comp-icon { font-size: 16px; }
  .dc-comp .comp-label { font-size: 9px; color: #a0aec0; margin-top: 1px; }
  .dc-comp .comp-val { font-size: 11px; font-weight: 700; margin-top: 2px; }
  .comp-val.have { color: #48bb78; }
  .comp-val.missing { color: #fc5c7d; }
  .comp-val.unknown { color: #cbd5e0; }

  /* 卡片：物流路径条 */
  .dc-shipping-track {
    padding: 8px 16px 12px; display: none;
  }
  .dc-shipping-track.visible { display: block; }
  .ship-route {
    display: flex; align-items: center; gap: 0;
    background: #f7fafc; border-radius: 10px; padding: 8px 12px;
  }
  .ship-node {
    display: flex; align-items: center; gap: 4px;
    font-size: 11px; color: #4a5568; font-weight: 500;
    white-space: nowrap;
  }
  .ship-node .node-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .ship-node .node-dot.green { background: #48bb78; }
  .ship-node .node-dot.blue { background: #4299e1; }
  .ship-node .node-dot.gray { background: #cbd5e0; }
  .ship-arrow { font-size: 12px; color: #cbd5e0; margin: 0 2px; flex-shrink: 0; }

  /* 卡片：时间线预览 */
  .dc-timeline-preview { padding: 8px 16px 12px; display: none; }
  .dc-timeline-preview.visible { display: block; }
  .tl-preview-item {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0; font-size: 12px; color: #718096;
  }
  .tl-preview-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .cat-t-teer .tl-preview-dot { background: #2d6a9f; }
  .cat-m-teer .tl-preview-dot { background: #9f2d6a; }
  .tl-preview-time { font-size: 11px; color: #a0aec0; min-width: 80px; }
  .tl-preview-loc { font-weight: 500; color: #4a5568; }
  .tl-preview-more { font-size: 11px; color: #a0aec0; font-style: italic; }

  /* ===== 详情页 - 汇报风格 ===== */
  .detail-header { color: white; padding: 16px 20px 20px; }
  .detail-header.cat-t-teer { background: linear-gradient(135deg, #0f2b44, #1e5a8a, #2d6a9f); }
  .detail-header.cat-m-teer { background: linear-gradient(135deg, #3d0f24, #7a2248, #9f2d6a); }
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    font-size: 15px; cursor: pointer; margin-bottom: 10px;
    opacity: 0.9; background: none; border: none; color: white; font-family: inherit;
  }
  .detail-device-name { font-size: 22px; font-weight: 800; }
  .detail-device-id { font-size: 13px; opacity: 0.7; margin-top: 3px; }

  /* 详情：快览卡片 */
  .detail-body { padding: 12px 16px 24px; }
  .quick-card {
    background: white; border-radius: 14px;
    padding: 16px; margin-bottom: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }
  .quick-card h3 {
    font-size: 12px; color: #a0aec0; font-weight: 700;
    margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;
  }

  /* 状态仪表盘 */
  .status-dashboard {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .sd-item {
    background: #f7fafc; border-radius: 10px; padding: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .sd-icon { font-size: 22px; flex-shrink: 0; }
  .sd-info { flex: 1; min-width: 0; }
  .sd-label { font-size: 11px; color: #a0aec0; font-weight: 500; }
  .sd-val { font-size: 14px; font-weight: 700; margin-top: 2px; }
  .sd-val.ok { color: #48bb78; }
  .sd-val.err { color: #fc5c7d; }
  .sd-val.warn { color: #ed8936; }
  .sd-val.mute { color: #a0aec0; }

  /* 使用状态横条 */
  .use-bar {
    display: flex; align-items: center; gap: 10px;
    background: #f7fafc; border-radius: 10px; padding: 12px; margin-bottom: 8px;
  }
  .use-bar .use-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .use-bar .use-dot.green { background: #48bb78; }
  .use-bar .use-dot.orange { background: #ed8936; }
  .use-bar .use-dot.red { background: #fc5c7d; }
  .use-bar .use-dot.blue { background: #4299e1; }
  .use-bar .use-dot.gray { background: #cbd5e0; }
  .use-bar .use-text { font-size: 14px; font-weight: 600; }
  .use-bar .use-sub { font-size: 12px; color: #718096; margin-left: auto; }

  /* 地点标注卡 */
  .location-card {
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, #ebf8ff, #bee3f8);
    border-radius: 12px; padding: 14px; margin-bottom: 8px;
  }
  .cat-m-teer .location-card {
    background: linear-gradient(135deg, #fce7f3, #fbb6ce);
  }
  .loc-pin { font-size: 28px; flex-shrink: 0; }
  .loc-info { flex: 1; }
  .loc-name { font-size: 16px; font-weight: 700; color: #1a202c; }
  .loc-detail { font-size: 12px; color: #4a5568; margin-top: 2px; }

  /* 物流路线图 */
  .logistics-route {
    background: #f7fafc; border-radius: 12px; padding: 16px; margin-bottom: 8px;
  }
  .lr-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .lr-title { font-size: 13px; font-weight: 700; color: #2d3748; }
  .lr-badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
  .lr-badge.transit { background: #ebf8ff; color: #2b6cb0; }
  .lr-badge.delivered { background: #f0fff4; color: #276749; }
  .lr-badge.pending { background: #fffaf0; color: #c05621; }
  .lr-nodes { display: flex; flex-direction: column; gap: 0; }
  .lr-node {
    display: flex; gap: 10px; padding: 8px 0; position: relative;
  }
  .lr-node::before {
    content: ''; position: absolute; left: 11px; top: 26px; bottom: -8px;
    width: 2px; background: #e2e8f0;
  }
  .lr-node:last-child::before { display: none; }
  .lr-dot {
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; flex-shrink: 0; background: white;
    border: 2px solid #e2e8f0;
  }
  .lr-dot.current { background: #4299e1; border-color: #90cdf4; color: white; }
  .lr-dot.done { background: #48bb78; border-color: #9ae6b4; color: white; }
  .lr-dot.pending-dot { background: white; border-color: #e2e8f0; color: #cbd5e0; }
  .lr-node-info { flex: 1; padding-top: 2px; }
  .lr-node-loc { font-size: 13px; font-weight: 600; color: #1a202c; }
  .lr-node-time { font-size: 11px; color: #a0aec0; margin-top: 2px; }
  .lr-node-desc { font-size: 12px; color: #718096; margin-top: 1px; }

  /* 详情时间轴 - 增强版 */
  .timeline-enhanced { padding: 4px 0; }
  .te-item {
    display: flex; gap: 12px; padding: 12px 0; position: relative;
  }
  .te-item::before {
    content: ''; position: absolute;
    left: 15px; top: 36px; bottom: -12px;
    width: 2px; background: #e2e8f0;
  }
  .te-item:last-child::before { display: none; }
  .te-dot {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; background: white;
    border: 2px solid #e2e8f0;
  }
  .cat-t-teer .te-dot { border-color: #90cdf4; background: #ebf8ff; }
  .cat-m-teer .te-dot { border-color: #fbb6ce; background: #fce7f3; }
  .te-content { flex: 1; min-width: 0; }
  .te-header { display: flex; justify-content: space-between; align-items: center; }
  .te-loc { font-size: 15px; font-weight: 700; color: #1a202c; }
  .te-time { font-size: 11px; color: #a0aec0; font-weight: 500; }
  .te-checker { font-size: 12px; color: #718096; margin-top: 3px; }
  .te-components { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .te-comp-tag {
    padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 600;
  }
  .te-comp-tag.ok { background: #f0fff4; color: #276749; }
  .te-comp-tag.err { background: #fff5f5; color: #c53030; }
  .te-refno { margin-top: 4px; font-size: 11px; color: #6b46c1; font-weight: 600; }

  /* 信息行 */
  .info-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 8px 0; border-bottom: 1px solid #f7fafc;
  }
  .info-row:last-child { border-bottom: none; }
  .info-label { font-size: 13px; color: #718096; flex-shrink: 0; width: 80px; }
  .info-value { font-size: 14px; color: #1a202c; text-align: right; flex: 1; word-break: break-all; }

  .status-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 20px;
    font-size: 13px; font-weight: 500;
  }
  .badge-ok { background: #f0fff4; color: #276749; }
  .badge-warn { background: #fffaf0; color: #c05621; }
  .badge-error { background: #fff5f5; color: #c53030; }
  .badge-unchecked { background: #f7fafc; color: #718096; }

  /* 快递绑定区 */
  .shipping-input-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  .shipping-input-row select, .shipping-input-row input {
    border: 1.5px solid #e2e8f0; border-radius: 8px; padding: 8px 10px; font-size: 13px; outline: none; font-family: inherit;
  }
  .shipping-input-row select { width: 110px; flex-shrink: 0; background: white; }
  .shipping-input-row input { flex: 1; min-width: 0; }
  .shipping-btn {
    padding: 8px 16px; border-radius: 8px; border: none; font-size: 13px; cursor: pointer; font-weight: 600; font-family: inherit;
    transition: all 0.15s;
  }
  .shipping-btn:active { transform: scale(0.96); }
  .shipping-btn.bind { background: #2b6cb0; color: white; }
  .shipping-btn.unbind { background: #fff5f5; color: #c53030; margin-left: 8px; }
  .shipping-btn.refresh { background: #ebf8ff; color: #2b6cb0; margin-left: 8px; }
  .shipping-info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .shipping-carrier { font-size: 13px; color: #2d3748; font-weight: 600; background: #edf2f7; padding: 3px 8px; border-radius: 4px; }
  .shipping-no { font-size: 13px; color: #4a5568; font-family: 'SF Mono', 'Consolas', monospace; }
  .shipping-no a { color: #2b6cb0; text-decoration: none; }
  .shipping-no a:hover { text-decoration: underline; }

  /* 媒体 */
  .media-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .media-thumb {
    aspect-ratio: 1; border-radius: 10px; overflow: hidden;
    background: #edf2f7; cursor: pointer; position: relative;
  }
  .media-thumb img, .media-thumb video { width: 100%; height: 100%; object-fit: cover; }
  .media-thumb .video-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.3); color: white; font-size: 24px;
  }
  .media-thumb .media-date {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
    color: white; font-size: 11px; padding: 12px 5px 4px; text-align: center;
  }
  .media-thumb .media-date .media-time { font-weight: 600; display: block; }
  .media-thumb .media-date .media-checker { font-size: 10px; opacity: 0.85; display: block; }

  /* 管理备注卡 - 扫码可见 */
  .admin-note-card {
    margin: 12px; padding: 14px 16px;
    background: linear-gradient(135deg, #fefcbf, #fefce8);
    border-radius: 12px; border-left: 4px solid #d69e2e;
    box-shadow: 0 2px 8px rgba(214,158,46,0.1);
  }
  .admin-note-card .anc-header {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700; color: #975a16; margin-bottom: 8px;
  }
  .admin-note-card .anc-header .anc-badge {
    background: #ed8936; color: white; padding: 2px 8px;
    border-radius: 10px; font-size: 10px; font-weight: 600;
  }
  .admin-note-card .anc-item {
    font-size: 13px; color: #744210; line-height: 1.6;
    padding: 4px 0; border-bottom: 1px solid rgba(214,158,46,0.15);
  }
  .admin-note-card .anc-item:last-child { border-bottom: none; }
  .admin-note-card .anc-item .anc-label {
    font-weight: 600; color: #975a16; margin-right: 4px;
  }
  .admin-note-card .anc-status {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 6px; padding: 3px 10px; border-radius: 12px;
    font-size: 12px; font-weight: 600;
  }
  .admin-note-card .anc-status.ok { background: #f0fff4; color: #276749; }
  .admin-note-card .anc-status.warn { background: #fffaf0; color: #c05621; }
  .admin-note-card .anc-status.error { background: #fff5f5; color: #c53030; }
  .admin-note-card .anc-status.info { background: #ebf8ff; color: #2b6cb0; }
  .admin-note-card .anc-repair {
    margin-top: 6px; padding: 6px 10px; background: #fff5f5;
    border-radius: 8px; font-size: 12px; color: #c53030; font-weight: 600;
    display: flex; align-items: center; gap: 4px;
  }

  /* 表单 */
  .form-section {
    background: white; border-radius: 14px;
    margin: 12px; overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }
  .form-section-title {
    font-size: 12px; color: #a0aec0; font-weight: 700;
    padding: 14px 16px 8px; border-bottom: 1px solid #f0f4f8;
    background: #fafbfc; text-transform: uppercase; letter-spacing: 1px;
  }
  .form-item {
    padding: 14px 16px; border-bottom: 1px solid #f7fafc;
    display: flex; align-items: center; gap: 12px;
  }
  .form-item:last-child { border-bottom: none; }
  .form-item label {
    font-size: 14px; color: #2d3748; font-weight: 500;
    width: 90px; flex-shrink: 0;
  }
  .form-item input, .form-item select, .form-item textarea {
    flex: 1; border: none; outline: none;
    font-size: 14px; color: #1a202c; background: transparent;
    font-family: inherit;
  }
  .form-item textarea { resize: none; height: 60px; align-self: flex-start; }

  .radio-group { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; }
  .radio-btn {
    flex: 1; min-width: 80px;
    padding: 8px 12px; border-radius: 8px; border: 1.5px solid #e2e8f0;
    text-align: center; font-size: 13px; cursor: pointer;
    transition: all 0.15s; color: #718096; background: white;
    font-family: inherit;
  }
  .radio-btn.selected.ok { border-color: #48bb78; background: #f0fff4; color: #276749; font-weight: 600; }
  .radio-btn.selected.error { border-color: #fc5c7d; background: #fff5f5; color: #c53030; font-weight: 600; }

  .upload-zone {
    margin: 12px 16px;
    border: 2px dashed #bee3f8; border-radius: 12px;
    padding: 20px; text-align: center; cursor: pointer;
    background: #ebf8ff; transition: all 0.15s;
  }
  .cat-m-teer .upload-zone { border-color: #fbb6ce; background: #fdf2f8; }
  .upload-zone .upload-icon { font-size: 36px; margin-bottom: 8px; }
  .upload-zone p { font-size: 14px; color: #2b6cb0; font-weight: 500; }
  .cat-m-teer .upload-zone p { color: #9f2d6a; }
  .upload-zone small { font-size: 12px; color: #718096; display: block; margin-top: 4px; }

  .upload-preview { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 12px 12px; }
  .preview-item {
    position: relative; width: 80px; height: 80px;
    border-radius: 8px; overflow: hidden; background: #edf2f7;
  }
  .preview-item img, .preview-item video { width: 100%; height: 100%; object-fit: cover; }
  .preview-item .remove-btn {

  .submit-btn {

  /* 成功弹层 */

  .success-card {

  .success-sub { font-size: 13px; color: #718096; margin-top: 6px; }
  .success-close {
    margin-top: 20px; padding: 10px 32px;

  /* 模态 */
  .modal-overlay {

  .modal-sheet {

  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .modal-btn.primary { background: #1e3a5f; color: white; }
  .modal-btn.secondary { background: #f7fafc; color: #1a202c; }

  /* 检查记录管理 */
  .records-container { padding: 12px 16px 24px; }
  .record-card {
    background: white; border-radius: 14px; padding: 16px; margin-bottom: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05); position: relative;
  }
  .record-card .record-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .record-card .record-time { font-size: 14px; font-weight: 600; color: #1a202c; }
  .record-card .record-checker { font-size: 12px; color: #718096; }
  .record-card .record-actions { display: flex; gap: 6px; }
  .record-card .record-actions button {
    border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px;
    font-weight: 500; cursor: pointer; font-family: inherit;
  }
  .record-card .btn-edit { background: #ebf4ff; color: #3182ce; }
  .record-card .btn-delete { background: #fff5f5; color: #e53e3e; }
  .record-card .record-body { font-size: 13px; color: #4a5568; line-height: 1.8; }
  .record-card .record-body .record-field { display: flex; justify-content: space-between; }
  .record-card .record-body .record-field-label { color: #718096; flex-shrink: 0; }
  .record-card .record-body .record-field-value { color: #1a202c; text-align: right; }
  .record-card .record-note { margin-top: 8px; padding: 8px; background: #f7fafc; border-radius: 8px; font-size: 12px; color: #4a5568; }
  .edit-field { margin-bottom: 14px; }
  .edit-field label { display: block; font-size: 13px; color: #718096; margin-bottom: 4px; font-weight: 500; }
  .edit-field input, .edit-field textarea, .edit-field select {
    width: 100%; padding: 10px 12px; border: 1.5px solid #e2e8f0; border-radius: 10px;
    font-size: 14px; font-family: inherit; background: white; box-sizing: border-box;
  }
  .edit-field input:focus, .edit-field textarea:focus { border-color: #667eea; outline: none; }
  .edit-field textarea { height: 60px; resize: vertical; }

  .empty-state { text-align: center; padding: 32px; color: #a0aec0; font-size: 14px; }
  .empty-state .empty-icon { font-size: 40px; margin-bottom: 8px; }

  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); color: white;
    padding: 10px 20px; border-radius: 24px;
    font-size: 14px; z-index: 2000;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  .loading-spinner {
    display: inline-block; width: 20px; height: 20px;

    animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== 详情页重构：主次分明 ===== */

  /* 顶部主信息条 */
  .primary-strip {
    background: white;
    border-radius: 16px;
    margin: 12px;
    padding: 16px 18px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.07);

  .ps-repair-tag {

  /* 时间线英雄区 */
  .timeline-hero {
    margin: 12px;

    border-radius: 16px;
    padding: 18px 16px 6px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.07);
  }
  .timeline-hero h3 {
    font-size: 15px; font-weight: 700; color: #1a202c;
    margin-bottom: 14px; display: flex; align-items: center; gap: 6px;
  }
  .timeline-hero .te-item {
    padding: 14px 0;
  }
  .timeline-hero .te-dot {
    width: 38px; height: 38px;
    font-size: 16px;
  }
  .timeline-hero .te-loc {
    font-size: 16px; font-weight: 700; color: #1a202c;
  }
  .timeline-hero .te-components {
    margin-top: 8px;
  }
  .timeline-hero .te-comp-tag {
    padding: 3px 9px; font-size: 11px;
  }

    margin-top: 6px;

  /* 折叠区 - 次要信息 */
  .collapse-section {
    margin: 0 12px 12px;
  }
  .collapse-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 13px 16px;
    background: #f7fafc;
    border-radius: 12px;
    cursor: pointer;
    font-size: 13px; font-weight: 600; color: #718096;
    transition: background 0.15s;
    border: 1px solid #edf2f7;
  }
  .collapse-header:active { background: #edf2f7; }
  .collapse-header .ch-arrow {
    transition: transform 0.2s; font-size: 11px; color: #a0aec0;
  }
  .collapse-header.open .ch-arrow { transform: rotate(180deg); }
  .collapse-body {
    max-height: 0; overflow: hidden;
    transition: max-height 0.35s ease;
  }
  .collapse-body.open { max-height: 3000px; }
  .collapse-inner {

  /* 次要卡片 - 弱化样式 */
  .secondary-card {

<body>

<!-- ===== 页面1：设备列表 - 汇报风格 ===== -->
<div id="page-list" class="page active">
  <div class="report-header" id="list-header">
    <div class="rh-top">
      <div>
        <div class="rh-title" id="list-title">TEER模拟器资产管理</div>
        <div class="rh-date" id="list-date"></div>
      </div>
      <div class="rh-badge" id="list-badge">—</div>
    </div>
  </div>
  <div class="report-stats" id="report-stats"></div>
  <div class="geo-bar" id="geo-bar"></div>
  <div class="device-list" id="device-list-container"></div>
</div>

<!-- ===== 页面2：设备详情 - 主次分明 ===== -->
<div id="page-detail" class="page">
  <div class="detail-header" id="detail-header">
    <button class="back-btn" onclick="goBack('page-list')">← 返回列表</button>
    <div class="detail-device-name" id="detail-name"></div>
    <div class="detail-device-id" id="detail-id"></div>
  </div>
  <div class="detail-body" style="padding-bottom:24px">

    <!-- 【主信息】状态 + 位置 顶条 -->
    <div class="primary-strip" id="primary-strip">
      <div class="ps-top">
        <div class="ps-status-group">
          <div id="ps-status-pill"></div>
          <div id="ps-repair-tag"></div>
        </div>
        <div class="ps-loc-group">
          <div class="ps-loc-name" id="ps-loc-name"></div>
          <div class="ps-loc-sub" id="ps-loc-sub"></div>
        </div>
      </div>
      <div id="ps-note" style="display:none"></div>
    </div>

    <!-- 【主信息】时间线英雄区 -->
    <div class="timeline-hero">
      <h3>📅 检查时间线</h3>
      <div class="timeline-enhanced" id="d-timeline"></div>
    </div>

    <!-- 【次要】器件状态 - 折叠 -->
    <div class="collapse-section">
      <div class="collapse-header" onclick="toggleCollapse(this)">
        🔩 器件功能详情 <span class="ch-arrow">▼</span>
      </div>
      <div class="collapse-body">
        <div class="collapse-inner">
          <div class="status-dashboard" id="d-status-dashboard"></div>
        </div>
      </div>
    </div>

    <!-- 【次要】管理备注 - 折叠 -->
    <div class="collapse-section" id="admin-note-section" style="display:none">
      <div class="collapse-header" onclick="toggleCollapse(this)">
        📌 管理备注 <span class="ch-arrow">▼</span>
      </div>
      <div class="collapse-body">
        <div class="collapse-inner" id="d-admin-note-content"></div>
      </div>
    </div>

    <!-- 【次要】关联单号 - 折叠 -->
    <div class="collapse-section" id="refno-section" style="display:none">
      <div class="collapse-header" onclick="toggleCollapse(this)">
        🔗 关联单号 <span class="ch-arrow">▼</span>
      </div>
      <div class="collapse-body">
        <div class="collapse-inner">
          <div id="d-refno-card-content" style="font-size:15px;color:#6b46c1;font-weight:700;margin-bottom:8px"></div>
          <button class="submit-btn" style="background:linear-gradient(135deg,#805ad5,#9f7aea);box-shadow:0 4px 14px rgba(128,90,213,0.3);padding:10px;font-size:14px;width:100%;margin:0" onclick="trackRefNo()">🔍 查询单号状态</button>
        </div>
      </div>
    </div>

    <!-- 【次要】快递追踪 - 折叠 -->
    <div class="collapse-section" id="shipping-section">
      <div class="collapse-header" onclick="toggleCollapse(this)">
        📦 快递追踪 <span class="ch-arrow">▼</span>
      </div>
      <div class="collapse-body">
        <div class="collapse-inner">
          <div id="shipping-bind-row" class="shipping-input-row">
            <select id="f-ship-carrier">
              <option value="">选择快递</option>
              <option value="shunfeng">顺丰速运</option>
              <option value="zhongtong">中通快递</option>
              <option value="yunda">韵达快递</option>
              <option value="yuantong">圆通速递</option>
              <option value="shentong">申通快递</option>
              <option value="jingdong">京东物流</option>
              <option value="ems">EMS</option>
              <option value="debang">德邦快递</option>
              <option value="tiantian">天天快递</option>
              <option value="huitongkuaidi">百世快递</option>
            </select>
            <input type="text" id="f-ship-no" placeholder="输入快递单号">
            <button class="shipping-btn bind" onclick="bindShipping()">绑定</button>
          </div>
          <div id="shipping-info-row" style="display:none">
            <div class="shipping-info">
              <span class="shipping-carrier" id="d-ship-carrier"></span>
              <span class="shipping-no" id="d-ship-no"></span>
              <button class="shipping-btn refresh" onclick="refreshTracking()">🔄 更新物流</button>
              <button class="shipping-btn unbind" onclick="unbindShipping()">✕ 解绑</button>
            </div>
          </div>
          <div id="d-ship-timeline"></div>
        </div>
      </div>
    </div>

    <!-- 【次要】媒体记录 - 折叠 -->
    <div class="collapse-section">
      <div class="collapse-header" onclick="toggleCollapse(this)">
        📸 现场媒体记录 <span class="ch-arrow">▼</span>
      </div>
      <div class="collapse-body">
        <div class="collapse-inner">
          <div class="media-grid" id="d-media"></div>
        </div>
      </div>
    </div>

    <!-- 操作按钮 -->
    <button class="submit-btn" id="btn-check" onclick="goToCheckForm()" style="margin:16px 12px 8px">📝 发起新检查</button>
    <button class="submit-btn" id="btn-records" style="margin:0 12px 8px;background:linear-gradient(135deg,#5a67d8,#667eea);box-shadow:0 4px 14px rgba(90,103,216,0.35)" onclick="openRecordsPage()">📋 检查记录管理</button>
    <button class="submit-btn" id="btn-qr" style="margin:0 12px 12px;background:linear-gradient(135deg,#276749,#38a169);box-shadow:0 4px 14px rgba(39,103,73,0.35)" onclick="showQRModal(currentDevice)">🔲 查看/打印二维码</button>
  </div>
</div>

<!-- ===== 页面3：检查表单 ===== -->
<div id="page-form" class="page">
  <div class="detail-header" id="form-header">
    <button class="back-btn" onclick="goBack('page-detail')">← 返回详情</button>
    <div class="detail-device-name" id="form-device-name"></div>
    <div class="detail-device-id" id="form-device-id"></div>
  </div>
  <div class="detail-body" style="padding:0">
  <!-- 管理备注卡 - 扫码可见 -->
  <div id="admin-note-card" class="admin-note-card" style="display:none">
    <div class="anc-header">📌 管理备注 <span class="anc-badge">管理员</span></div>
    <div id="anc-content"></div>
  </div>
  <div class="form-section">
    <div class="form-section-title">📋 基本信息</div>

    <div class="form-item"><label>当前位置</label><input type="text" id="f-location" placeholder="⚠️ 请填写本次检查的实际位置（勿直接使用默认值）" style="font-size:13px" oninput="updateSubmitBtnState()"></div>
    <div class="form-item"><label>关联单号 <span style="color:#a0aec0;font-size:12px;font-weight:400">（选填）</span></label><input type="text" id="f-refno" placeholder="如：PO-2024-001 / 项目编号"></div>
  </div>
  <div class="form-section">
    <div class="form-section-title">🔩 器件检查</div>
    <div class="form-item">
      <label>扩张鞘</label>
      <div class="radio-group">
        <button class="radio-btn" data-group="dilator" data-val="有" data-cls="ok" onclick="selectRadio(this)">✅ 有</button>
        <button class="radio-btn" data-group="dilator" data-val="无" data-cls="error" onclick="selectRadio(this)">❌ 无</button>
      </div>
    </div>
    <div class="form-item">
      <label>心脏模型</label>
      <div class="radio-group">
        <button class="radio-btn" data-group="heartmodel" data-val="有" data-cls="ok" onclick="selectRadio(this)">✅ 有</button>
        <button class="radio-btn" data-group="heartmodel" data-val="无" data-cls="error" onclick="selectRadio(this)">❌ 无</button>
      </div>
    </div>
    <div class="form-item">
      <label>导引鞘</label>
      <div class="radio-group">
        <button class="radio-btn" data-group="guidesheath" data-val="有" data-cls="ok" onclick="selectRadio(this)">✅ 有</button>
        <button class="radio-btn" data-group="guidesheath" data-val="无" data-cls="error" onclick="selectRadio(this)">❌ 无</button>
      </div>
    </div>
    <div class="form-item">
      <label>瓣膜夹</label>
      <div class="radio-group">
        <button class="radio-btn" data-group="clip" data-val="有" data-cls="ok" onclick="selectRadio(this);toggleClipFunc()">✅ 有</button>
        <button class="radio-btn" data-group="clip" data-val="无" data-cls="error" onclick="selectRadio(this);toggleClipFunc()">❌ 无</button>
      </div>
    </div>
  </div>
  <div class="form-section" id="clipfunc-section" style="display:none">
    <div class="form-section-title">⚡ 瓣膜夹功能检查</div>
    <div class="form-item">
      <label>功能状态（可多选）</label>
      <div class="radio-group" style="flex-wrap:wrap">
        <button class="radio-btn" data-group="clipfunc" data-val="可用" data-cls="ok" onclick="toggleCheck(this)">✅ 可用</button>
        <button class="radio-btn" data-group="clipfunc" data-val="夹子打不开" data-cls="error" onclick="toggleCheck(this)">❌ 夹子打不开</button>
        <button class="radio-btn" data-group="clipfunc" data-val="gripper down失效" data-cls="error" onclick="toggleCheck(this)">❌ gripper down失效</button>
        <button class="radio-btn" data-group="clipfunc" data-val="打弯失效" data-cls="error" onclick="toggleCheck(this)">❌ 打弯失效</button>
        <button class="radio-btn" data-group="clipfunc" data-val="配件缺失" data-cls="error" onclick="toggleCheck(this)">❌ 配件缺失</button>
        <button class="radio-btn" data-group="clipfunc" data-val="其他" data-cls="warn" onclick="toggleCheck(this)">⚠️ 其他</button>
      </div>
    </div>
    <div class="form-item" id="clipfunc-other-row" style="display:none"><label>其他说明</label><textarea id="f-clipfunc-other" placeholder="请描述其他问题…"></textarea></div>
  </div>
  <div class="form-section">
    <div class="form-section-title">📸 现场媒体上传</div>
    <div class="upload-zone" onclick="document.getElementById('file-input').click()">
      <div class="upload-icon">📷</div>

    </div>
    <input type="file" id="file-input" multiple accept="image/*,video/*" style="display:none" onchange="handleFileSelect(event)">
    <div class="upload-preview" id="upload-preview"></div>
  </div>
  <div class="form-section">
    <div class="form-section-title">📝 备注</div>

// ============================================================
// IndexedDB 媒体存储
// ============================================================
const MEDIA_DB_NAME = "TEER_MediaStore";
const MEDIA_DB_VERSION = 1;
const MEDIA_STORE = "blobs";

function openMediaDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(MEDIA_DB_NAME, MEDIA_DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(MEDIA_STORE)) {
        db.createObjectStore(MEDIA_STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveMediaBlob(id, blob) {
  const db = await openMediaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE, "readwrite");
    tx.objectStore(MEDIA_STORE).put({ id, blob });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getMediaBlob(id) {
  const db = await openMediaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE, "readonly");
    const req = tx.objectStore(MEDIA_STORE).get(id);
    req.onsuccess = () => resolve(req.result ? req.result.blob : null);
    req.onerror = () => reject(req.error);
  });
}

async function deleteMediaBlob(id) {
  const db = await openMediaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE, "readwrite");
    tx.objectStore(MEDIA_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function mediaBlobId(deviceId, index) {
  return `${deviceId}_media_${index}`;
}

const mediaURLCache = {};

async function getMediaURL(deviceId, index) {
  const key = mediaBlobId(deviceId, index);
  if (mediaURLCache[key]) return mediaURLCache[key];
  const blob = await getMediaBlob(key);
  if (!blob) return null;
  const url = URL.createObjectURL(blob);
  mediaURLCache[key] = url;
  return url;
}

// ============================================================
// 初始化设备
// ============================================================
function createDefaultDevices(catKey) {
  const cat = CATEGORIES[catKey];
  const arr = [];
  for (let i = 1; i <= cat.count; i++) {
    const num = String(i).padStart(3, "0");
    const id = `${cat.idPrefix}-${num}`;
    const preset = DEVICE_PRESETS[id] || {};
    arr.push({
      id: id,
      name: `${cat.defaultName} #${i}`,
      icon: cat.icon,
      location: preset.location || "",
      region: preset.region || "",
      owner: preset.owner || "",
      useStatus: preset.status || "",
      needRepair: preset.repair || false,
      presetNote: preset.note || "",
      category: catKey,
      dilator: "",
      heartmodel: "",
      guidesheath: "",
      clip: "",
      clipfunc: [],
      clipfuncOther: "",
      lastCheck: null,
      nextCheck: null,
      anomaly: "",
      logs: [],
      media: []
    });
  }
  return arr;
}

function loadData() {
  try {
    const stored = localStorage.getItem(STORE_KEY);
    if (stored) return JSON.parse(stored);
  } catch(e) {}
  return null;
}

function saveAllData(allData) {
  localStorage.setItem(STORE_KEY, JSON.stringify(allData));
}

function ensureDevices(catKey) {
  let allData = loadData();
  if (!allData) allData = {};
  if (!allData[catKey]) {
    allData[catKey] = createDefaultDevices(catKey);
    saveAllData(allData);
  } else {
    allData[catKey].forEach(d => {
      const preset = DEVICE_PRESETS[d.id];
      if (preset) {
        d.owner = preset.owner;
        d.region = preset.region;
        d.location = preset.location;
        d.useStatus = preset.status;
        d.needRepair = preset.repair;
        d.presetNote = preset.note;
      }
    });
    saveAllData(allData);
  }
  return allData[catKey];
}

function saveCurrentDevices() {
  let allData = loadData() || {};
  const cleanDevices = devices.map(d => {
    const clean = Object.assign({}, d);
    if (clean.media && clean.media.length > 0) {
      clean.media = clean.media.map(m => {
        const copy = Object.assign({}, m);
        delete copy.data;
        return copy;
      });
    }
    return clean;
  });
  allData[currentCat] = cleanDevices;
  saveAllData(allData);
}

function editStatusNote() {

  noteEl.appendChild(input);
  input.focus();

    currentDevice.statusNote = val;
    saveCurrentDevices();

      noteEl.innerHTML = `<span id="ps-note-text">${val}</span><span style="font-size:11px;color:#b7791f;margin-left:6px;cursor:pointer" onclick="editStatusNote()">✏️</span>`;

    }

  input.addEventListener("blur", save);

}

// ============================================================
// URL路由
// ============================================================
function getCategoryFromURL() {
  const params = new URLSearchParams(window.location.search);
  const cat = params.get("cat");
  if (cat && CATEGORIES[cat]) return cat;
  const dev = params.get("device");
  if (dev && dev.startsWith("T-TEER")) return "t-teer";
  if (dev && dev.startsWith("M-TEER")) return "m-teer";
  return null;
}

// ============================================================
// 状态工具
// ============================================================
function getStatusClass(dev) {
  if (!dev.dilator && !dev.heartmodel && !dev.guidesheath && !dev.clip) return "status-unchecked";
  const missing = [dev.dilator, dev.heartmodel, dev.guidesheath, dev.clip].filter(v => v === "无").length;
  const hasClipIssue = dev.clip === "有" && dev.clipfunc && dev.clipfunc.length > 0 && !dev.clipfunc.includes("可用");
  if (missing > 0 || hasClipIssue) return "status-error";
  const allHave = [dev.dilator, dev.heartmodel, dev.guidesheath, dev.clip].every(v => v === "有");
  if (allHave) return "status-ok";
  return "status-warn";
}

function getStatusPill(dev) {
  const cls = getStatusClass(dev);
  if (cls === "status-ok") return '<span class="dc-status-pill pill-ok">✅ 正常</span>';
  if (cls === "status-error") return '<span class="dc-status-pill pill-error">❌ 异常</span>';
  if (cls === "status-warn") return '<span class="dc-status-pill pill-warn">⚠️ 注意</span>';
  return '<span class="dc-status-pill pill-unchecked">⏳ 待检</span>';
}

function getCompVal(v) {
  if (v === "有") return '<span class="comp-val have">✓</span>';
  if (v === "无") return '<span class="comp-val missing">✗</span>';
  return '<span class="comp-val unknown">—</span>';
}

// ============================================================
// 渲染列表 - 汇报风格
// ============================================================
function renderDeviceList() {
  const cat = CATEGORIES[currentCat];
  const header = document.getElementById("list-header");
  header.className = `report-header ${cat.catClass}`;

  const now = new Date();
  const dateStr = now.toLocaleDateString("zh-CN", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
  document.getElementById("list-title").textContent = `${cat.icon} ${cat.label}`;
  document.getElementById("list-date").textContent = dateStr;

  // 统计
  const ok = devices.filter(d => getStatusClass(d) === "status-ok").length;
  const err = devices.filter(d => getStatusClass(d) === "status-error").length;
  const warn = devices.filter(d => getStatusClass(d) === "status-warn").length;
  const unc = devices.length - ok - err - warn;
  const inTransit = devices.filter(d => d.shipping && d.shipping.trackingNo).length;
  const repairCount = devices.filter(d => d.needRepair).length;

  document.getElementById("list-badge").textContent = `共 ${devices.length} 台`;

  document.getElementById("report-stats").innerHTML = `
    <div class="r-stat"><div class="r-icon">✅</div><div class="r-num" style="color:#48bb78">${ok}</div><div class="r-label">正常</div></div>
    <div class="r-stat"><div class="r-icon">❌</div><div class="r-num" style="color:#fc5c7d">${err}</div><div class="r-label">异常</div></div>
    <div class="r-stat"><div class="r-icon">📦</div><div class="r-num" style="color:#6b46c1">${inTransit}</div><div class="r-label">运输中</div></div>
    <div class="r-stat"><div class="r-icon">🔧</div><div class="r-num" style="color:#ed8936">${repairCount}</div><div class="r-label">待维修</div></div>
  `;

  // 地理分布
  const geoMap = {};
  devices.forEach(d => {
    const loc = d.location || "未知";
    if (!geoMap[loc]) geoMap[loc] = [];
    geoMap[loc].push(d);
  });
  const geoColors = ["#ebf8ff,#2b6cb0", "#fce7f3,#9f2d6a", "#fefcbf,#975a16", "#f0fff4,#276749", "#fff5f5,#c53030", "#faf5ff,#6b46c1", "#fffaf0,#c05621", "#ebf4ff,#3182ce"];
  let geoIdx = 0;
  const geoHtml = Object.entries(geoMap).map(([loc, devs]) => {
    const colors = geoColors[geoIdx % geoColors.length].split(",");
    const statusIcons = devs.map(d => {
      const cls = getStatusClass(d);
      if (cls === "status-ok") return "🟢";
      if (cls === "status-error") return "🔴";
      if (cls === "status-warn") return "🟡";
      return "⚪";
    }).join("");
    geoIdx++;
    return `<span class="geo-chip" style="background:${colors[0]};color:${colors[1]}">📍 ${loc} <span class="geo-count">${devs.length}台</span> ${statusIcons}</span>`;
  }).join("");
  document.getElementById("geo-bar").innerHTML = `<h3>📍 地理分布</h3><div class="geo-chips">${geoHtml}</div>`;

  // 设备卡片
  const container = document.getElementById("device-list-container");
  container.innerHTML = devices.map(d => {
    const cls = getStatusClass(d);
    const catCls = cat.catClass;
    const pill = getStatusPill(d);

    // 器件快览
    const comps = `
      <div class="dc-comp"><div class="comp-icon">🔧</div><div class="comp-label">扩张鞘</div>${getCompVal(d.dilator)}</div>
      <div class="dc-comp"><div class="comp-icon">❤️</div><div class="comp-label">心脏模型</div>${getCompVal(d.heartmodel)}</div>
      <div class="dc-comp"><div class="comp-icon">📏</div><div class="comp-label">导引鞘</div>${getCompVal(d.guidesheath)}</div>
      <div class="dc-comp"><div class="comp-icon">📎</div><div class="comp-label">瓣膜夹</div>${getCompVal(d.clip)}</div>
    `;

    // 物流路径条
    let shipTrackHtml = '';
    if (d.shipping && d.shipping.trackingNo) {
      const s = d.shipping;
      const tl = s.timeline || [];
      const from = tl.length > 0 ? (tl[tl.length-1].location || "发货地") : "发货地";
      const to = d.location || "目的地";
      const isDelivered = s.status === "delivered";
      const isTransit = s.status === "in_transit";
      const carrierName = CARRIER_NAMES[s.carrier] || "";
      shipTrackHtml = `
        <div class="dc-shipping-track visible">
          <div class="ship-route">
            <div class="ship-node"><div class="node-dot green"></div>${from || "始发"}</div>
            <div class="ship-arrow">→</div>
            ${isTransit ? `<div class="ship-node"><div class="node-dot blue"></div>运输中</div><div class="ship-arrow">→</div>` : ''}
            <div class="ship-node"><div class="node-dot ${isDelivered ? 'green' : 'gray'}"></div>${to}</div>
            <span style="margin-left:auto;font-size:10px;color:#a0aec0">${carrierName} ${s.trackingNo.slice(-4)}</span>
          </div>
        </div>`;
    }

    // 时间线预览（最近2条）
    let tlPreviewHtml = '';
    if (d.logs && d.logs.length > 0) {
      const recent = d.logs.slice(-2).reverse();
      const items = recent.map(log => `
        <div class="tl-preview-item">
          <div class="tl-preview-dot"></div>
          <div class="tl-preview-time">${log.time ? log.time.split(' ')[0] || log.time : ''}</div>
          <div class="tl-preview-loc">📍 ${log.location || '—'}</div>
        </div>
      `).join('');
      const more = d.logs.length > 2 ? `<div class="tl-preview-more">… 共 ${d.logs.length} 条记录</div>` : '';
      tlPreviewHtml = `
        <div class="dc-timeline-preview visible">
          ${items}
          ${more}
        </div>`;
    }

    // 标签
    const tags = [];
    tags.push(`<span class="dc-tag loc">📍 ${d.location || '未知'}</span>`);
    tags.push(`<span class="dc-tag owner">👤 ${d.owner || '—'}</span>`);
    if (d.region) tags.push(`<span class="dc-tag">🏢 ${d.region}</span>`);
    if (d.shipping && d.shipping.trackingNo) tags.push(`<span class="dc-tag shipping">📦 运输中</span>`);
    if (d.needRepair) tags.push(`<span class="dc-tag repair">🔧 待维修</span>`);
    if (d.useStatus) tags.push(`<span class="dc-tag">${d.useStatus}</span>`);

    return `
      <div class="device-card ${catCls}"
        onclick="openDetail('${d.id}')"
        ontouchstart="handleLongPress('${d.id}')" ontouchend="cancelLongPress()">
        <div class="dc-top">
          <div class="dc-icon">${d.icon}</div>
          <div class="dc-info">
            <div class="dc-name">${d.name}</div>
            <div class="dc-id">${d.id}</div>
          </div>
          ${pill}
        </div>
        <div class="dc-meta">${tags.join('')}</div>
        <div class="dc-components">${comps}</div>
        ${shipTrackHtml}
        ${tlPreviewHtml}
      </div>`;
  }).join('');
}

function toggleCollapse(headerEl) {
  const body = headerEl.nextElementSibling;
  const isOpen = body.classList.contains('open');
  if (isOpen) {
    body.classList.remove('open');
    headerEl.classList.remove('open');
  } else {
    body.classList.add('open');
    headerEl.classList.add('open');
  }
}

    "": { cls: "info", text: "⚪ 未设置", sub: "" }
  };
  const us = useStatusMap[currentDevice.useStatus] || { cls: "info", text: "⚪ " + (currentDevice.useStatus || "未设置"), sub: "" };
  document.getElementById("ps-status-pill").innerHTML = `<div class="ps-status-pill ${us.cls}">${us.text}</div>`;

  // 维修标记
  const repairTag = document.getElementById("ps-repair-tag");
  if (currentDevice.needRepair) {
    repairTag.innerHTML = `<div class="ps-repair-tag">🔧 待维修</div>`;
    repairTag.style.display = "block";
  } else {
    repairTag.style.display = "none";
  }

  // 位置
  document.getElementById("ps-loc-name").innerHTML = `📍 ${currentDevice.location || '未知'}`;
  const subParts = [currentDevice.region, currentDevice.owner].filter(Boolean);
  document.getElementById("ps-loc-sub").textContent = subParts.join(' · ') || '—';

  // 备注（可点击编辑）
  const noteEl = document.getElementById("ps-note");
  const noteText = currentDevice.statusNote || (currentDevice.needRepair ? currentDevice.presetNote : "");
  if (noteText && noteText.trim()) {
    noteEl.style.display = "block";
    noteEl.innerHTML = `<span id="ps-note-text">${noteText}</span><span style="font-size:11px;color:#b7791f;margin-left:6px;cursor:pointer" onclick="editStatusNote()">✏️</span>`;
  } else {
    noteEl.style.display = "block";
    noteEl.innerHTML = `<span style="color:#b7791f;font-style:italic;cursor:pointer" onclick="editStatusNote()">+ 点击添加备注</span>`;
  }

  // ===== 管理备注折叠区 =====
  const adminSection = document.getElementById("admin-note-section");
  const hasDNote = (currentDevice.presetNote && currentDevice.presetNote.trim()) ||
                   (currentDevice.statusNote && currentDevice.statusNote.trim()) ||
                   currentDevice.needRepair ||
                   (currentDevice.shipping && currentDevice.shipping.trackingNo);
  if (hasDNote) {
    adminSection.style.display = "block";
    let dNoteHtml = "";
    if (currentDevice.presetNote && currentDevice.presetNote.trim()) {
      dNoteHtml += `<div style="font-size:13px;color:#744210;line-height:1.6;padding:4px 0"><span style="font-weight:600;color:#975a16">📝 设备备注：</span>${currentDevice.presetNote}</div>`;
    }
    if (currentDevice.statusNote && currentDevice.statusNote.trim()) {
      dNoteHtml += `<div style="font-size:13px;color:#744210;line-height:1.6;padding:4px 0"><span style="font-weight:600;color:#975a16">💬 状态备注：</span>${currentDevice.statusNote}</div>`;
    }
    if (currentDevice.needRepair) {
      dNoteHtml += `<div style="font-size:12px;color:#c53030;font-weight:600;padding:6px 10px;background:#fff5f5;border-radius:8px;margin-top:4px">⚠️ 该设备需要维修</div>`;
    }
    if (currentDevice.shipping && currentDevice.shipping.trackingNo) {
      const s = currentDevice.shipping;
      const carrierName = CARRIER_NAMES[s.carrier] || s.carrier;
      dNoteHtml += `<div style="font-size:12px;color:#6b46c1;padding:4px 0;margin-top:2px">📦 ${carrierName} ${s.trackingNo}${s.status === 'delivered' ? ' (已签收)' : ' (运输中)'}</div>`;
    }
    document.getElementById("d-admin-note-content").innerHTML = dNoteHtml;
  } else {
    adminSection.style.display = "none";
  }

  // ===== 器件状态仪表盘（折叠区内） =====
  const yn = v => v === "有" ? "ok" : v === "无" ? "err" : "mute";
  const ynText = v => v === "有" ? "✅ 正常" : v === "无" ? "❌ 缺失" : "— 待检";
  let clipfuncText = "";
  if (currentDevice.clip === "有" && currentDevice.clipfunc && currentDevice.clipfunc.length > 0) {
    const labels = currentDevice.clipfunc.map(v => v === "其他" && currentDevice.clipfuncOther ? "其他：" + currentDevice.clipfuncOther : v);
    const hasIssue = !currentDevice.clipfunc.includes("可用");
    clipfuncText = hasIssue
      ? `<div class="sd-item" style="grid-column:1/-1"><div class="sd-icon">⚡</div><div class="sd-info"><div class="sd-label">瓣膜夹功能</div><div class="sd-val err">${labels.join("、")}</div></div></div>`
      : `<div class="sd-item" style="grid-column:1/-1"><div class="sd-icon">⚡</div><div class="sd-info"><div class="sd-label">瓣膜夹功能</div><div class="sd-val ok">✅ ${labels.join("、")}</div></div></div>`;
  }
  const lastCheckTime = currentDevice.lastCheck || "从未检查";
  document.getElementById("d-status-dashboard").innerHTML = `
    <div class="sd-item"><div class="sd-icon">🔧</div><div class="sd-info"><div class="sd-label">扩张鞘</div><div class="sd-val ${yn(currentDevice.dilator)}">${ynText(currentDevice.dilator)}</div></div></div>
    <div class="sd-item"><div class="sd-icon">❤️</div><div class="sd-info"><div class="sd-label">心脏模型</div><div class="sd-val ${yn(currentDevice.heartmodel)}">${ynText(currentDevice.heartmodel)}</div></div></div>
    <div class="sd-item"><div class="sd-icon">📏</div><div class="sd-info"><div class="sd-label">导引鞘</div><div class="sd-val ${yn(currentDevice.guidesheath)}">${ynText(currentDevice.guidesheath)}</div></div></div>
    <div class="sd-item"><div class="sd-icon">📎</div><div class="sd-info"><div class="sd-label">瓣膜夹</div><div class="sd-val ${yn(currentDevice.clip)}">${ynText(currentDevice.clip)}</div></div></div>
    ${clipfuncText}
    <div class="sd-item" style="grid-column:1/-1"><div class="sd-icon">🕐</div><div class="sd-info"><div class="sd-label">最近检查</div><div class="sd-val ${currentDevice.lastCheck ? 'ok' : 'mute'}">${lastCheckTime}</div></div></div>
  `;

  // ===== 关联单号（折叠区） =====
  const latestLog = currentDevice.logs && currentDevice.logs.length > 0 ? currentDevice.logs[currentDevice.logs.length - 1] : null;
  const refSection = document.getElementById("refno-section");
  if (latestLog && latestLog.refNo) {
    refSection.style.display = "block";
    document.getElementById("d-refno-card-content").textContent = latestLog.refNo;
    currentRefNo = latestLog.refNo;
  } else {
    refSection.style.display = "none";
    currentRefNo = "";
  }

  // ===== 时间线 + 媒体 + 快递 =====
  renderTimeline(currentDevice, cat);
  renderMedia(currentDevice);
  renderShipping(currentDevice);

  // 按钮样式
  document.getElementById("btn-check").className = `submit-btn ${cat.catClass}`;
  showPage("page-detail");
}

const CARRIER_NAMES = {
  shunfeng: "顺丰速运", zhongtong: "中通快递", yunda: "韵达快递",
  yuantong: "圆通速递", shentong: "申通快递", jingdong: "京东物流",
  ems: "EMS", debang: "德邦快递", tiantian: "天天快递", huitongkuaidi: "百世快递"
};
const CARRIER_TRACK_URLS = {
  shunfeng: "https://www.sf-express.com/sf-service-owf-web/service/rate/onewayDomestic/search?keyword={no}",
  zhongtong: "https://www.zto.com/search?billCode={no}",
  yunda: "https://www.yundaex.com/cxbill.php?fkcod={no}",
  yuantong: "https://www.yto.net.cn/html/search/{no}",
  shentong: "https://www.sto.cn/search?billCode={no}",
  jingdong: "https://www.jd.com/logistics/{no}",
  ems: "https://www.ems.com.cn/query/{no}",
  debang: "https://www.deppon.com/query/{no}",
  tiantian: "https://www.ttkdex.com/search/{no}",
  huitongkuaidi: "https://www.htky365.com/search/{no}"
};

const TRACKING_API = "https://teer-tracking-api.vercel.app/api/track";

function renderShipping(device) {
  const bindRow = document.getElementById("shipping-bind-row");
  const infoRow = document.getElementById("shipping-info-row");
  const timeline = document.getElementById("d-ship-timeline");

  if (!device.shipping || !device.shipping.trackingNo) {
    bindRow.style.display = "flex";
    infoRow.style.display = "none";
    timeline.innerHTML = '<div style="text-align:center;color:#a0aec0;font-size:13px;padding:12px 0">暂无快递信息，可绑定单号追踪物流</div>';
    return;
  }

  bindRow.style.display = "none";
  infoRow.style.display = "block";
  const s = device.shipping;
  document.getElementById("d-ship-carrier").textContent = CARRIER_NAMES[s.carrier] || s.carrier;
  const trackUrl = (CARRIER_TRACK_URLS[s.carrier] || "").replace("{no}", s.trackingNo);
  document.getElementById("d-ship-no").innerHTML = trackUrl
    ? `<a href="${trackUrl}" target="_blank" rel="noopener">${s.trackingNo} ↗</a>`
    : s.trackingNo;

  // 物流路线图
  if (s.timeline && s.timeline.length > 0) {
    const nodes = s.timeline.map((t, i) => {
      const dotCls = i === 0 ? 'current' : 'done';
      const icon = i === 0 ? '📦' : '✓';
      return `
        <div class="lr-node">
          <div class="lr-dot ${dotCls}">${icon}</div>
          <div class="lr-node-info">
            <div class="lr-node-loc">${t.location || ''}</div>
            <div class="lr-node-desc">${t.desc || t.status || ''}</div>
            <div class="lr-node-time">${t.time || ''}</div>
          </div>
        </div>`;
    }).join('');
    timeline.innerHTML = `
      <div class="logistics-route">
        <div class="lr-header">
          <div class="lr-title">📦 ${CARRIER_NAMES[s.carrier] || '快递'} ${s.trackingNo}</div>
          <span class="lr-badge ${s.status === 'delivered' ? 'delivered' : 'transit'}">${s.status === 'delivered' ? '已签收' : '运输中'}</span>
        </div>
        <div class="lr-nodes">${nodes}</div>
      </div>`;
  } else {
    timeline.innerHTML = '<div style="text-align:center;color:#a0aec0;font-size:13px;padding:12px 0">点击"更新物流"获取最新状态</div>';
  }
}

function bindShipping() {
  const carrier = document.getElementById("f-ship-carrier").value;
  const trackingNo = document.getElementById("f-ship-no").value.trim();
  if (!carrier) { showToast("请选择快递公司"); return; }
  if (!trackingNo) { showToast("请输入快递单号"); return; }
  currentDevice.shipping = {
    carrier, trackingNo,
    status: "in_transit",
    bindTime: new Date().toLocaleString("zh-CN"),
    timeline: []
  };
  saveCurrentDevices();
  renderShipping(currentDevice);
  showToast("快递单号已绑定");
  refreshTracking();
}

function unbindShipping() {
  if (!confirm("确定解绑快递单号？")) return;
  delete currentDevice.shipping;
  document.getElementById("f-ship-carrier").value = "";
  document.getElementById("f-ship-no").value = "";
  saveCurrentDevices();
  renderShipping(currentDevice);
  showToast("已解绑");
}

async function refreshTracking() {
  if (!currentDevice.shipping) return;
  const s = currentDevice.shipping;
  try {
    const resp = await fetch(`${TRACKING_API}?carrier=${encodeURIComponent(s.carrier)}&no=${encodeURIComponent(s.trackingNo)}`);
    if (!resp.ok) throw new Error("API请求失败");
    const data = await resp.json();
    if (data.timeline && data.timeline.length > 0) {
      s.timeline = data.timeline;
      s.status = data.status || "in_transit";
      s.lastUpdate = new Date().toLocaleString("zh-CN");
      saveCurrentDevices();
      renderShipping(currentDevice);
      showToast("物流已更新");
    } else {
      renderShipping(currentDevice);
      showToast("暂无物流信息");
    }
  } catch (e) {
    console.warn("Tracking API error:", e);
    renderShipping(currentDevice);
    showToast("API暂不可用，点击单号到官网查询");
  }
}

function renderTimeline(device, cat) {
  const container = document.getElementById("d-timeline");
  if (!device.logs || device.logs.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">📅</div>暂无检查记录</div>`;
    return;
  }
  const sorted = [...device.logs].reverse();
  container.innerHTML = sorted.map(log => {
    // 器件标签
    const compTags = [];
    if (log.dilator) compTags.push(`<span class="te-comp-tag ${log.dilator === '有' ? 'ok' : 'err'}">扩张鞘:${log.dilator}</span>`);
    if (log.heartmodel) compTags.push(`<span class="te-comp-tag ${log.heartmodel === '有' ? 'ok' : 'err'}">心脏模型:${log.heartmodel}</span>`);
    if (log.guidesheath) compTags.push(`<span class="te-comp-tag ${log.guidesheath === '有' ? 'ok' : 'err'}">导引鞘:${log.guidesheath}</span>`);
    if (log.clip) compTags.push(`<span class="te-comp-tag ${log.clip === '有' ? 'ok' : 'err'}">瓣膜夹:${log.clip}</span>`);
    if (log.clipfunc && log.clipfunc.length > 0) {
      const funcLabels = log.clipfunc.map(v => v === "其他" && log.clipfuncOther ? "其他：" + log.clipfuncOther : v);
      compTags.push(`<span class="te-comp-tag err">${funcLabels.join("、")}</span>`);
    }
    const refNoHtml = log.refNo ? `<div class="te-refno">🔗 单号：${log.refNo}</div>` : '';
    const noteHtml = log.note ? `<div style="font-size:11px;color:#718096;margin-top:4px">📝 ${log.note}</div>` : '';

    return `
      <div class="te-item">
        <div class="te-dot">📍</div>
        <div class="te-content">
          <div class="te-header">
            <div class="te-loc">${log.location || "位置未记录"}</div>
            <div class="te-time">${log.time || ''}</div>
          </div>
          <div class="te-checker">检查人：${log.checker || "—"}</div>
          <div class="te-components">${compTags.join('')}</div>
          ${refNoHtml}${noteHtml}
        </div>
      </div>`;
  }).join('');
}

async function renderMedia(device) {
  const container = document.getElementById("d-media");
  if (!device.media || device.media.length === 0) {
    container.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📷</div>暂无媒体记录</div>`;
    return;
  }
  const items = [];
  for (let i = 0; i < device.media.length; i++) {
    const m = device.media[i];
    let url = null;
    if (m.data) { url = m.data; }
    else if (m.blobKey) { url = await getMediaURL(device.id, i); }
    if (!url) { items.push(`<div class="media-thumb"><div style="display:flex;align-items:center;justify-content:center;height:100%;color:#a0aec0;font-size:12px;">加载失败</div></div>`); continue; }
    if (m.type === "video") {
      items.push(`<div class="media-thumb" onclick="viewMedia(${i})"><video src="${url}" muted playsinline></video><div class="video-overlay">▶</div><div class="media-date"><span class="media-time">${m.time || ''}</span>${m.checker ? `<span class="media-checker">${m.checker}</span>` : ''}</div></div>`);
    } else {
      items.push(`<div class="media-thumb" onclick="viewMedia(${i})"><img src="${url}" alt="检查图片"><div class="media-date"><span class="media-time">${m.time || ''}</span>${m.checker ? `<span class="media-checker">${m.checker}</span>` : ''}</div></div>`);
    }
  }
  container.innerHTML = items.join('');
}

async function viewMedia(index) {
  if (!currentDevice || !currentDevice.media[index]) return;
  const m = currentDevice.media[index];
  let url = m.data || null;
  if (!url && m.blobKey) {
    const blob = await getMediaBlob(m.blobKey);
    if (blob) url = URL.createObjectURL(blob);
  }
  if (!url) { showToast("无法加载媒体"); return; }
  const win = window.open();
  win.document.write(`<style>body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;}</style>${m.type === "video" ? `<video src="${url}" controls autoplay style="max-width:100%;max-height:100vh;"></video>` : `<img src="${url}" style="max-width:100%;max-height:100vh;">`}`);
}
