function goToCheckForm() {
  if (!currentDevice) return;
  const cat = CATEGORIES[currentCat];
  document.getElementById("form-header").className = `detail-header ${cat.catClass}`;
  document.getElementById("form-device-name").textContent = currentDevice.name;
  document.getElementById("form-device-id").textContent = currentDevice.id;

  // 渲染管理备注卡 - 扫码可见
  const noteCard = document.getElementById("admin-note-card");
  const noteContent = document.getElementById("anc-content");
  const hasPresetNote = currentDevice.presetNote && currentDevice.presetNote.trim();
  const hasStatusNote = currentDevice.statusNote && currentDevice.statusNote.trim();
  const hasRepair = currentDevice.needRepair;
  const hasUseStatus = currentDevice.useStatus && currentDevice.useStatus.trim();
  const hasShipping = currentDevice.shipping && currentDevice.shipping.trackingNo;

  if (hasPresetNote || hasStatusNote || hasRepair || hasUseStatus || hasShipping) {
    noteCard.style.display = "block";
    let html = "";

    // 使用状态
    if (hasUseStatus) {
      const statusMap = {
        "保管地": { cls: "ok", icon: "🟢" },
        "调用中": { cls: "warn", icon: "🟠" },
        "待维修": { cls: "error", icon: "🔴" },
        "招标": { cls: "info", icon: "🔵" }
      };
      const sm = statusMap[currentDevice.useStatus] || { cls: "info", icon: "⚪" };
      html += `<div class="anc-item"><span class="anc-status ${sm.cls}">${sm.icon} ${currentDevice.useStatus}</span></div>`;
    }

    // 保管人 & 位置
    if (currentDevice.owner || currentDevice.location) {
      html += `<div class="anc-item"><span class="anc-label">📍 位置：</span>${currentDevice.location || '未知'}${currentDevice.region ? ' · ' + currentDevice.region : ''}${currentDevice.owner ? ' · 👤 ' + currentDevice.owner : ''}</div>`;
    }

    // 管理员备注 (presetNote)
    if (hasPresetNote) {
      html += `<div class="anc-item"><span class="anc-label">📝 备注：</span>${currentDevice.presetNote}</div>`;
    }

    // 状态备注 (statusNote)
    if (hasStatusNote) {
      html += `<div class="anc-item"><span class="anc-label">💬 状态备注：</span>${currentDevice.statusNote}</div>`;
    }

    // 维修提示
    if (hasRepair) {
      html += `<div class="anc-repair">⚠️ 该设备需要维修${currentDevice.presetNote && !hasPresetNote ? '：' + currentDevice.presetNote : ''}</div>`;
    }

    // 物流信息
    if (hasShipping) {
      const s = currentDevice.shipping;
      const carrierName = CARRIER_NAMES[s.carrier] || s.carrier;
      html += `<div class="anc-item"><span class="anc-label">📦 物流：</span>${carrierName} ${s.trackingNo}${s.status === 'delivered' ? ' (已签收)' : ' (运输中)'}</div>`;
    }

    noteContent.innerHTML = html;
  } else {
    noteCard.style.display = "none";
  }
  document.getElementById("f-checker").value = "";
  document.getElementById("f-location").value = "";
  document.getElementById("f-refno").value = "";
  document.getElementById("f-note").value = "";
  document.getElementById("upload-preview").innerHTML = "";
  document.getElementById("clipfunc-section").style.display = "none";
  document.getElementById("clipfunc-other-row").style.display = "none";
  selectedFiles = [];
  document.querySelectorAll(".radio-btn").forEach(b => b.classList.remove("selected", "ok", "warn", "error"));
  radioSelections["dilator"] = null;
  radioSelections["heartmodel"] = null;
  radioSelections["guidesheath"] = null;
  radioSelections["clip"] = null;
  radioSelections["clipfunc"] = [];
  checkSelections["clipfunc"] = [];
  document.getElementById("submit-btn").className = `submit-btn ${cat.catClass} disabled`;
  updateSubmitBtnState();
  showPage("page-form");
}

function updateSubmitBtnState() {
  const checker = document.getElementById("f-checker").value.trim();
  const location = document.getElementById("f-location").value.trim();
  const dilator = radioSelections["dilator"];
  const heartmodel = radioSelections["heartmodel"];
  const guidesheath = radioSelections["guidesheath"];
  const clip = radioSelections["clip"];
  const clipfunc = radioSelections["clipfunc"] || [];
  const allFilled = checker && location && dilator && heartmodel && guidesheath && clip && (clip === "无" || clipfunc.length > 0);
  const btn = document.getElementById("submit-btn");
  if (allFilled) btn.classList.remove("disabled");
  else btn.classList.add("disabled");
}

function selectRadio(btn) {
  const group = btn.dataset.group;
  radioSelections[group] = btn.dataset.val;
  document.querySelectorAll(`.radio-btn[data-group="${group}"]`).forEach(b => b.classList.remove("selected", "ok", "warn", "error"));
  btn.classList.add("selected", btn.dataset.cls);
  updateSubmitBtnState();
}

function toggleClipFunc() {
  const hasClip = radioSelections["clip"] === "有";
  document.getElementById("clipfunc-section").style.display = hasClip ? "block" : "none";
  if (!hasClip) {
    document.querySelectorAll('.radio-btn[data-group="clipfunc"]').forEach(b => b.classList.remove("selected", "ok", "warn", "error"));
    radioSelections["clipfunc"] = [];
    document.getElementById("clipfunc-other-row").style.display = "none";
  }
  updateSubmitBtnState();
}

const checkSelections = {};
function toggleCheck(btn) {
  const group = btn.dataset.group;
  if (!checkSelections[group]) checkSelections[group] = [];
  const val = btn.dataset.val;
  const idx = checkSelections[group].indexOf(val);
  if (idx >= 0) { checkSelections[group].splice(idx, 1); btn.classList.remove("selected", btn.dataset.cls); }
  else { checkSelections[group].push(val); btn.classList.add("selected", btn.dataset.cls); }
  radioSelections[group] = checkSelections[group] || [];
  const otherRow = document.getElementById("clipfunc-other-row");
  if (checkSelections[group].includes("其他")) otherRow.style.display = "block";
  else otherRow.style.display = "none";
  updateSubmitBtnState();
}

function handleFileSelect(event) {
  Array.from(event.target.files).forEach(file => {
    if (file.size > MAX_FILE_SIZE) { showToast("文件超过500MB限制"); return; }
    const isVideo = file.type.startsWith("video");
    const blobUrl = URL.createObjectURL(file);
    selectedFiles.push({ file, blobUrl, type: isVideo ? "video" : "image" });
    renderUploadPreview();
  });
  event.target.value = "";
}

function renderUploadPreview() {
  document.getElementById("upload-preview").innerHTML = selectedFiles.map((f, i) => `
    <div class="preview-item">
      ${f.type === "video" ? `<video src="${f.blobUrl}" muted></video>` : `<img src="${f.blobUrl}" alt="预览">`}
      <div class="preview-type">${f.type === "video" ? "视频" : "图片"}</div>
      <button class="remove-btn" onclick="removeFile(${i})">✕</button>
    </div>`).join('');
}

function removeFile(index) { selectedFiles.splice(index, 1); renderUploadPreview(); }

async function submitCheck() {
  const submitBtn = document.getElementById("submit-btn");
  if (submitBtn.classList.contains("disabled")) { showToast("请先填写所有必填项"); return; }
  const checker = document.getElementById("f-checker").value.trim();
  const location = document.getElementById("f-location").value.trim();
  const dilator = radioSelections["dilator"];
  const heartmodel = radioSelections["heartmodel"];
  const guidesheath = radioSelections["guidesheath"];
  const clip = radioSelections["clip"];
  const clipfunc = radioSelections["clipfunc"] || [];
  if (!checker) { showToast("请填写检查人姓名"); return; }
  if (!location) { showToast("请填写当前位置"); return; }
  if (!dilator || !heartmodel || !guidesheath || !clip) { showToast("请完成所有器件检查"); return; }
  if (clip === "有" && clipfunc.length === 0) { showToast("请选择瓣膜夹功能状态"); return; }

  submitBtn.disabled = true;
  submitBtn.innerHTML = `<span class="loading-spinner"></span> 提交中...`;

  const now = new Date();
  const timeStr = now.toLocaleString("zh-CN", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
  const clipfuncOther = document.getElementById("f-clipfunc-other") ? document.getElementById("f-clipfunc-other").value.trim() : "";
  const note = document.getElementById("f-note").value.trim();
  const refNo = document.getElementById("f-refno").value.trim();

  const anomalyParts = [];
  if (dilator === "无") anomalyParts.push("扩张鞘：无");
  if (heartmodel === "无") anomalyParts.push("心脏模型：无");
  if (guidesheath === "无") anomalyParts.push("导引鞘：无");
  if (clip === "无") anomalyParts.push("瓣膜夹：无");
  if (clip === "有" && clipfunc.length > 0) {
    const funcLabels = clipfunc.map(v => v === "其他" && clipfuncOther ? "其他：" + clipfuncOther : v);
    anomalyParts.push("瓣膜夹功能：" + funcLabels.join("、"));
  }

  const mediaStartIdx = (currentDevice.media || []).length;
  const mediaRecords = [];
  for (let fi = 0; fi < selectedFiles.length; fi++) {
    const f = selectedFiles[fi];
    const blobIdx = mediaStartIdx + fi;
    const blobKey = mediaBlobId(currentDevice.id, blobIdx);
    await saveMediaBlob(blobKey, f.file);
    mediaRecords.push({ type: f.type, time: timeStr, checker, blobKey });
  }

  const logEntry = { time: timeStr, checker, location, refNo, dilator, heartmodel, guidesheath, clip, clipfunc, clipfuncOther, nextCheck: "", note, mediaCount: mediaRecords.length };

  currentDevice.location = location;
  currentDevice.owner = currentDevice.owner || checker;
  currentDevice.dilator = dilator;
  currentDevice.heartmodel = heartmodel;
  currentDevice.guidesheath = guidesheath;
  currentDevice.clip = clip;
  currentDevice.clipfunc = clipfunc;
  currentDevice.clipfuncOther = clipfuncOther;
  currentDevice.lastCheck = timeStr;
  currentDevice.anomaly = anomalyParts.join("\n") || "";
  currentDevice.logs = currentDevice.logs || [];
  currentDevice.logs.push(logEntry);
  currentDevice.media = (currentDevice.media || []).concat(mediaRecords);

  saveCurrentDevices();

  await new Promise(r => setTimeout(r, 800));
  submitBtn.disabled = false;
  submitBtn.innerHTML = "提交检查记录";
  document.getElementById("success-sub").textContent = `已记录 ${timeStr} 的检查数据`;
  document.getElementById("success-overlay").classList.add("show");
}

function afterSubmit() {
  document.getElementById("success-overlay").classList.remove("show");
  openDetail(currentDevice.id);
}

function trackRefNo() {
  if (!currentRefNo) { showToast("暂无关联单号"); return; }
  const url = `https://www.kuaidi100.com/?coname=${encodeURIComponent(currentRefNo)}`;
  window.open(url, "_blank");
}

// ============================================================
// 检查记录管理
// ============================================================
let editingRecordIndex = -1;
let deletingRecordIndex = -1;

function openRecordsPage() {
  if (!currentDevice) return;
  const cat = CATEGORIES[currentCat];
  document.getElementById("records-device-name").textContent = currentDevice.name;
  document.getElementById("records-device-id").textContent = currentDevice.id;
  document.getElementById("records-header").className = `detail-header ${cat.catClass}`;
  renderRecordsList();
  showPage("page-records");
}

function renderRecordsList() {
  const container = document.getElementById("records-list");
  if (!currentDevice.logs || currentDevice.logs.length === 0) {
    container.innerHTML = `<div class="empty-state" style="padding:48px 0"><div class="empty-icon">📋</div>暂无检查记录</div>`;
    return;
  }
  const sorted = [...currentDevice.logs].reverse();
  const yn = v => v === "有" ? `<span class="status-badge badge-ok">✅ 有</span>` : v === "无" ? `<span class="status-badge badge-error">❌ 无</span>` : v || "—";

  container.innerHTML = sorted.map((log, si) => {
    const realIdx = currentDevice.logs.length - 1 - si;
    const clipfuncStr = (log.clipfunc && log.clipfunc.length > 0)
      ? log.clipfunc.map(v => v === "其他" && log.clipfuncOther ? "其他：" + log.clipfuncOther : v).join("、")
      : "";
    return `
    <div class="record-card">
      <div class="record-header">
        <div>
          <div class="record-time">${log.time || "未知时间"}</div>
          <div class="record-checker">检查人：${log.checker || "—"}</div>
        </div>
        <div class="record-actions">
          <button class="btn-edit" onclick="openEditRecordModal(${realIdx})">✏️ 编辑</button>
          <button class="btn-delete" onclick="openDeleteConfirm(${realIdx})">🗑️ 删除</button>
        </div>
      </div>
      <div class="record-body">
        <div class="record-field"><span class="record-field-label">📍 位置</span><span class="record-field-value">${log.location || "—"}</span></div>
        ${log.refNo ? `<div class="record-field"><span class="record-field-label">🔗 关联单号</span><span class="record-field-value" style="color:#6b46c1;font-weight:600">${log.refNo}</span></div>` : ""}
        <div class="record-field"><span class="record-field-label">扩张鞘</span><span class="record-field-value">${yn(log.dilator)}</span></div>
        <div class="record-field"><span class="record-field-label">心脏模型</span><span class="record-field-value">${yn(log.heartmodel)}</span></div>
        <div class="record-field"><span class="record-field-label">导引鞘</span><span class="record-field-value">${yn(log.guidesheath)}</span></div>
        <div class="record-field"><span class="record-field-label">瓣膜夹</span><span class="record-field-value">${yn(log.clip)}</span></div>
        ${clipfuncStr ? `<div class="record-field"><span class="record-field-label">瓣膜夹功能</span><span class="record-field-value" style="color:#9b2c2c;font-size:12px">${clipfuncStr}</span></div>` : ""}
        ${log.note ? `<div class="record-note">📝 ${log.note}</div>` : ""}
      </div>
    </div>`;
  }).join("");
}

function openEditRecordModal(idx) {
  editingRecordIndex = idx;
  const log = currentDevice.logs[idx];
  if (!log) return;

  const yn = (field, val) => `
    <select id="edit-${field}" style="width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;font-family:inherit">
      <option value="有" ${val === "有" ? "selected" : ""}>✅ 有</option>
      <option value="无" ${val === "无" ? "selected" : ""}>❌ 无</option>
      <option value="" ${!val ? "selected" : ""}>— 未记录</option>
    </select>`;

  const clipfuncOptions = ["可用","夹子打不开","gripper down失效","打弯失效","配件缺失","其他"];
  const clipfuncChecks = clipfuncOptions.map(v => {
    const checked = (log.clipfunc && log.clipfunc.includes(v)) ? "checked" : "";
    return `<label style="display:inline-flex;align-items:center;gap:4px;margin:4px 8px 4px 0;font-size:13px;cursor:pointer"><input type="checkbox" class="edit-clipfunc" value="${v}" ${checked}> ${v}</label>`;
  }).join("");

  document.getElementById("edit-record-form").innerHTML = `
    <div class="edit-field"><label>检查时间</label><input type="text" id="edit-time" value="${log.time || ''}"></div>
    <div class="edit-field"><label>检查人</label><input type="text" id="edit-checker" value="${log.checker || ''}"></div>
    <div class="edit-field"><label>位置</label><input type="text" id="edit-location" value="${log.location || ''}"></div>
    <div class="edit-field"><label>关联单号</label><input type="text" id="edit-refno" value="${log.refNo || ''}"></div>
    <div class="edit-field"><label>扩张鞘</label>${yn("dilator", log.dilator)}</div>
    <div class="edit-field"><label>心脏模型</label>${yn("heartmodel", log.heartmodel)}</div>
    <div class="edit-field"><label>导引鞘</label>${yn("guidesheath", log.guidesheath)}</div>
    <div class="edit-field"><label>瓣膜夹</label>${yn("clip", log.clip)}</div>
    <div class="edit-field"><label>瓣膜夹功能（多选）</label><div style="padding:4px 0">${clipfuncChecks}</div></div>
    <div class="edit-field"><label>瓣膜夹功能-其他描述</label><input type="text" id="edit-clipfuncOther" value="${log.clipfuncOther || ''}"></div>
    <div class="edit-field"><label>备注</label><textarea id="edit-note">${log.note || ''}</textarea></div>
  `;
  document.getElementById("edit-record-modal").classList.add("show");
}

function closeEditRecordModal(event) {
  if (event && event.target !== document.getElementById("edit-record-modal")) return;
  document.getElementById("edit-record-modal").classList.remove("show");
}

function saveEditRecord() {
  if (editingRecordIndex < 0 || !currentDevice.logs[editingRecordIndex]) return;
  const log = currentDevice.logs[editingRecordIndex];
  log.time = document.getElementById("edit-time").value.trim();
  log.checker = document.getElementById("edit-checker").value.trim();
  log.location = document.getElementById("edit-location").value.trim();
  log.refNo = document.getElementById("edit-refno").value.trim();
  log.dilator = document.getElementById("edit-dilator").value;
  log.heartmodel = document.getElementById("edit-heartmodel").value;
  log.guidesheath = document.getElementById("edit-guidesheath").value;
  log.clip = document.getElementById("edit-clip").value;
  const clipfuncEls = document.querySelectorAll(".edit-clipfunc:checked");
  log.clipfunc = Array.from(clipfuncEls).map(el => el.value);
  log.clipfuncOther = document.getElementById("edit-clipfuncOther").value.trim();
  log.note = document.getElementById("edit-note").value.trim();
  if (editingRecordIndex === currentDevice.logs.length - 1) {
    currentDevice.dilator = log.dilator;
    currentDevice.heartmodel = log.heartmodel;
    currentDevice.guidesheath = log.guidesheath;
    currentDevice.clip = log.clip;
    currentDevice.clipfunc = log.clipfunc;
    currentDevice.clipfuncOther = log.clipfuncOther;
    currentDevice.lastCheck = log.time;
    currentDevice.location = log.location;
  }
  saveCurrentDevices();
  closeEditRecordModal();
  renderRecordsList();
  showToast("记录已更新");
}

function openDeleteConfirm(idx) {
  deletingRecordIndex = idx;
  const log = currentDevice.logs[idx];
  document.getElementById("delete-record-info").textContent = `${log.time || "未知时间"} · ${log.checker || "未知检查人"}`;
  document.getElementById("delete-confirm-modal").classList.add("show");
}

function closeDeleteModal(event) {
  if (event && event.target !== document.getElementById("delete-confirm-modal")) return;
  document.getElementById("delete-confirm-modal").classList.remove("show");
}

function confirmDeleteRecord() {
  if (deletingRecordIndex < 0) return;
  const log = currentDevice.logs[deletingRecordIndex];
  if (log.mediaCount && log.mediaCount > 0) {
    let mediaOffset = 0;
    for (let i = 0; i < deletingRecordIndex; i++) mediaOffset += (currentDevice.logs[i].mediaCount || 0);
    for (let mi = 0; mi < log.mediaCount; mi++) {
      const globalMediaIdx = mediaOffset + mi;
      if (currentDevice.media[globalMediaIdx] && currentDevice.media[globalMediaIdx].blobKey) deleteMediaBlob(currentDevice.media[globalMediaIdx].blobKey);
    }
    currentDevice.media.splice(mediaOffset, log.mediaCount);
  }
  currentDevice.logs.splice(deletingRecordIndex, 1);
  if (currentDevice.logs.length > 0) {
    const latestLog = currentDevice.logs[currentDevice.logs.length - 1];
    currentDevice.dilator = latestLog.dilator || "";
    currentDevice.heartmodel = latestLog.heartmodel || "";
    currentDevice.guidesheath = latestLog.guidesheath || "";
    currentDevice.clip = latestLog.clip || "";
    currentDevice.clipfunc = latestLog.clipfunc || [];
    currentDevice.clipfuncOther = latestLog.clipfuncOther || "";
    currentDevice.lastCheck = latestLog.time || null;
  } else {
    currentDevice.dilator = ""; currentDevice.heartmodel = ""; currentDevice.guidesheath = "";
    currentDevice.clip = ""; currentDevice.clipfunc = []; currentDevice.clipfuncOther = ""; currentDevice.lastCheck = null;
  }
  saveCurrentDevices();
  closeDeleteModal();
  renderRecordsList();
  showToast("记录已删除");
}

// ============================================================
// 二维码
// ============================================================
let currentQRDevice = null;

function showQRModal(deviceOrId) {
  let device = typeof deviceOrId === "object" ? deviceOrId : devices.find(d => d.id === deviceOrId);
  if (!device) return;
  currentQRDevice = device;
  document.getElementById("qr-modal-title").textContent = `${device.icon} ${device.name}`;
  const qrContainer = document.getElementById("qrcode-container");
  qrContainer.innerHTML = "";
  document.getElementById("qr-label").textContent = `${device.id} · 扫码查看详情/发起检查`;
  const baseUrl = window.location.href.split("?")[0];
  const qrUrl = `${baseUrl}?cat=${currentCat}&device=${device.id}`;
  new QRCode(qrContainer, {
    text: qrUrl, width: 200, height: 200,
    colorDark: CATEGORIES[currentCat].color, colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });
  document.getElementById("qr-modal").classList.add("show");
}

function closeQRModal(event) {
  if (!event || event.target === document.getElementById("qr-modal")) {
    document.getElementById("qr-modal").classList.remove("show");
  }
}

function printQR() {
  if (!currentQRDevice) return;
  const canvas = document.querySelector("#qrcode-container canvas");
  if (!canvas) return;
  const qrDataUrl = canvas.toDataURL();
  const cat = CATEGORIES[currentCat];
  const win = window.open("", "_blank");
  win.document.write(`<!DOCTYPE html><html><head><title>二维码 - ${currentQRDevice.name}</title>
    <style>@page{size:60mm 80mm;margin:0}body{font-family:'PingFang SC',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8mm}
    .label{font-size:14px;font-weight:700;text-align:center;margin-bottom:4px}.id{font-size:11px;color:#555;text-align:center;margin-bottom:8px}
    img{width:48mm;height:48mm;display:block}.scan-hint{font-size:9px;color:#888;text-align:center;margin-top:6px}</style></head>
    <body><div class="label">${currentQRDevice.icon} ${currentQRDevice.name}</div><div class="id">${currentQRDevice.id}</div><img src="${qrDataUrl}">
    <div class="scan-hint">${cat.shortLabel} · 扫码查看详情/发起检查</div><script>window.onload=function(){window.print();}<\/script></body></html>`);
  win.document.close();
}

// ============================================================
// 导航
// ============================================================
function showPage(pageId) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(pageId).classList.add("active");
  window.scrollTo(0, 0);
}

function goBack(pageId) {
  if (pageId === "page-list") renderDeviceList();
  showPage(pageId);
}

let longPressTimer = null;
function handleLongPress(id) { longPressTimer = setTimeout(() => showQRModal(id), 600); }
function cancelLongPress() { if (longPressTimer) clearTimeout(longPressTimer); }

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}

// 初始化
// ============================================================
function init() {
  const catKey = getCategoryFromURL();
  if (!catKey) {
    document.getElementById("page-list").innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:32px;text-align:center">
        <div style="font-size:48px;margin-bottom:16px">🏥</div>
        <h2 style="font-size:20px;font-weight:700;margin-bottom:8px">TEER模拟器资产管理</h2>
        <p style="font-size:14px;color:#718096;margin-bottom:32px">请选择管理分类</p>
        <a href="?cat=t-teer" style="display:block;width:260px;padding:20px;margin-bottom:16px;background:linear-gradient(135deg,#0f2b44,#1e5a8a,#2d6a9f);color:white;border-radius:16px;text-decoration:none;font-size:17px;font-weight:700;box-shadow:0 6px 20px rgba(30,58,95,0.35)">🏥 T-TEER模拟器</a>
        <a href="?cat=m-teer" style="display:block;width:260px;padding:20px;margin-bottom:16px;background:linear-gradient(135deg,#3d0f24,#7a2248,#9f2d6a);color:white;border-radius:16px;text-decoration:none;font-size:17px;font-weight:700;box-shadow:0 6px 20px rgba(95,30,58,0.35)">📊 M-TEER模拟器</a>
        <p style="font-size:12px;color:#a0aec0;margin-top:16px">扫描设备二维码可直接进入对应分类</p>
      </div>`;
    document.getElementById("page-list").classList.add("active");
    return;
  }
  currentCat = catKey;
  devices = ensureDevices(catKey);
  renderDeviceList();

  const params = new URLSearchParams(window.location.search);
  const deviceId = params.get("device");
  const action = params.get("action");
  if (deviceId) {
    const dev = devices.find(d => d.id === deviceId);
    if (dev) {
      openDetail(deviceId);
      if (action === "inspect") setTimeout(() => goToCheckForm(), 300);
      return;
    }
  }
  showPage("page-list");
}

init();
