<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TEER模拟器资产管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
    background: #f0f4f8;
    color: #1a202c;
    min-height: 100vh;
  }
  .page { display: none; }
  .page.active { display: block; }

  /* 顶部栏 - 按分类着色 */
  .header {
    color: white;
    padding: 20px 16px 16px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }
  .header.cat-t-teer { background: linear-gradient(135deg, #1e3a5f 0%, #2d6a9f 100%); }
  .header.cat-m-teer { background: linear-gradient(135deg, #5f1e3a 0%, #9f2d6a 100%); }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header p { font-size: 12px; opacity: 0.75; margin-top: 3px; }

  /* 设备列表 */
  .device-list { padding: 12px; }
  .device-card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 10px;
    display: flex; align-items: center;
    box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    cursor: pointer;
    transition: all 0.15s;
    border-left: 4px solid #e2e8f0;
  }
  .device-card:active { transform: scale(0.98); }
  .device-card.status-ok { border-left-color: #48bb78; }
  .device-card.status-warn { border-left-color: #ed8936; }
  .device-card.status-error { border-left-color: #fc5c7d; }
  .device-card.status-unchecked { border-left-color: #a0aec0; }

  .device-icon {
    width: 44px; height: 44px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0; margin-right: 12px;
  }
  .cat-t-teer .device-icon { background: #ebf8ff; }
  .cat-m-teer .device-icon { background: #fce7f3; }

  .device-info { flex: 1; min-width: 0; }
  .device-name { font-size: 15px; font-weight: 600; color: #1a202c; }
  .device-id { font-size: 12px; color: #718096; margin-top: 2px; }
  .device-meta { font-size: 11px; color: #4a5568; margin-top: 3px; background: #f7fafc; padding: 2px 6px; border-radius: 4px; display: inline-block; }
  .device-status { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #a0aec0; flex-shrink: 0; }
  .status-dot.ok { background: #48bb78; }
  .status-dot.warn { background: #ed8936; }
  .status-dot.error { background: #fc5c7d; }
  .status-text { font-size: 12px; color: #718096; }
  .last-check { font-size: 11px; color: #a0aec0; margin-top: 2px; }
  .arrow { color: #cbd5e0; font-size: 18px; margin-left: 8px; }

  /* 统计条 */
  .stats-bar {
    display: flex; gap: 8px; padding: 0 12px 12px;
  }
  .stat-chip {
    flex: 1; background: white; border-radius: 8px;
    padding: 10px 12px; text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .stat-num { font-size: 20px; font-weight: 700; }
  .stat-num.green { color: #48bb78; }
  .stat-num.red { color: #fc5c7d; }
  .stat-num.gray { color: #a0aec0; }
  .stat-label { font-size: 11px; color: #718096; margin-top: 2px; }

  /* 详情页 */
  .detail-header { color: white; padding: 16px; }
  .detail-header.cat-t-teer { background: linear-gradient(135deg, #1e3a5f 0%, #2d6a9f 100%); }
  .detail-header.cat-m-teer { background: linear-gradient(135deg, #5f1e3a 0%, #9f2d6a 100%); }
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    font-size: 15px; cursor: pointer; margin-bottom: 12px;
    opacity: 0.9; background: none; border: none; color: white;
  }
  .detail-device-name { font-size: 20px; font-weight: 700; }
  .detail-device-id { font-size: 13px; opacity: 0.75; margin-top: 3px; }
  .detail-body { padding: 12px; }

  .info-card {
    background: white; border-radius: 12px;
    padding: 16px; margin-bottom: 12px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  }
  .info-card h3 {
    font-size: 13px; color: #718096; font-weight: 500;
    margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .info-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 8px 0; border-bottom: 1px solid #f7fafc;
  }
  .info-row:last-child { border-bottom: none; }
  .info-label { font-size: 13px; color: #718096; flex-shrink: 0; width: 80px; }
  .info-value { font-size: 14px; color: #1a202c; text-align: right; flex: 1; word-break: break-all; }

  .status-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 20px;
    font-size: 13px; font-weight: 500;
  }
  .badge-ok { background: #f0fff4; color: #276749; }
  .badge-warn { background: #fffaf0; color: #c05621; }
  .badge-error { background: #fff5f5; color: #c53030; }
  .badge-unchecked { background: #f7fafc; color: #718096; }

  /* 时间轴 */
  .timeline { padding: 8px 16px 16px; }
  .timeline-item { display: flex; gap: 12px; padding: 10px 0; position: relative; }
  .timeline-item::before {
    content: ''; position: absolute;
    left: 7px; top: 26px; bottom: -10px;
    width: 2px; background: #e2e8f0;
  }
  .timeline-item:last-child::before { display: none; }
  .tl-dot {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid #bee3f8; flex-shrink: 0; margin-top: 2px;
  }
  .cat-t-teer .tl-dot { background: #2d6a9f; border-color: #bee3f8; }
  .cat-m-teer .tl-dot { background: #9f2d6a; border-color: #fbb6ce; }
  .tl-content { flex: 1; }
  .tl-location { font-size: 14px; font-weight: 600; color: #1a202c; }
  .tl-time { font-size: 12px; color: #a0aec0; margin-top: 2px; }
  .tl-checker { font-size: 12px; color: #718096; margin-top: 2px; }
  .tl-status { margin-top: 4px; }

  /* 媒体 */
  .media-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .media-thumb {
    aspect-ratio: 1; border-radius: 8px; overflow: hidden;
    background: #edf2f7; cursor: pointer; position: relative;
  }
  .media-thumb img, .media-thumb video { width: 100%; height: 100%; object-fit: cover; }
  .media-thumb .video-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.3); color: white; font-size: 24px;
  }
  .media-thumb .media-date {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
    color: white; font-size: 11px; padding: 12px 5px 4px; text-align: center;
  }
  .media-thumb .media-date .media-time { font-weight: 600; display: block; }
  .media-thumb .media-date .media-checker { font-size: 10px; opacity: 0.85; display: block; }

  /* 表单 */
  .form-section {
    background: white; border-radius: 12px;
    margin: 12px; overflow: hidden;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  }
  .form-section-title {
    font-size: 13px; color: #718096; font-weight: 500;
    padding: 14px 16px 8px; border-bottom: 1px solid #f0f4f8;
    background: #fafafa; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .form-item {
    padding: 14px 16px; border-bottom: 1px solid #f7fafc;
    display: flex; align-items: center; gap: 12px;
  }
  .form-item:last-child { border-bottom: none; }
  .form-item label {
    font-size: 14px; color: #2d3748; font-weight: 500;
    width: 90px; flex-shrink: 0;
  }
  .form-item input, .form-item select, .form-item textarea {
    flex: 1; border: none; outline: none;
    font-size: 14px; color: #1a202c; background: transparent;
    font-family: inherit;
  }
  .form-item textarea { resize: none; height: 60px; align-self: flex-start; }

  .radio-group { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; }
  .radio-btn {
    flex: 1; min-width: 80px;
    padding: 8px 12px; border-radius: 8px; border: 1.5px solid #e2e8f0;
    text-align: center; font-size: 13px; cursor: pointer;
    transition: all 0.15s; color: #718096; background: white;
    font-family: inherit;
  }
  .radio-btn.selected.ok { border-color: #48bb78; background: #f0fff4; color: #276749; font-weight: 600; }
  .radio-btn.selected.error { border-color: #fc5c7d; background: #fff5f5; color: #c53030; font-weight: 600; }

  .upload-zone {
    margin: 12px 16px;
    border: 2px dashed #bee3f8; border-radius: 12px;
    padding: 20px; text-align: center; cursor: pointer;
    background: #ebf8ff; transition: all 0.15s;
  }
  .cat-m-teer .upload-zone { border-color: #fbb6ce; background: #fdf2f8; }
  .upload-zone .upload-icon { font-size: 36px; margin-bottom: 8px; }
  .upload-zone p { font-size: 14px; color: #2b6cb0; font-weight: 500; }
  .cat-m-teer .upload-zone p { color: #9f2d6a; }
  .upload-zone small { font-size: 12px; color: #718096; display: block; margin-top: 4px; }

  .upload-preview { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 12px 12px; }
  .preview-item {
    position: relative; width: 80px; height: 80px;
    border-radius: 8px; overflow: hidden; background: #edf2f7;
  }
  .preview-item img, .preview-item video { width: 100%; height: 100%; object-fit: cover; }
  .preview-item .remove-btn {
    position: absolute; top: -3px; right: -3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fc5c7d; color: white;
    border: none; font-size: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  .preview-type {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.5); color: white;
    font-size: 10px; padding: 2px 4px; text-align: center;
  }

  .submit-btn {
    display: block; width: calc(100% - 24px);
    margin: 12px; padding: 16px;
    color: white; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: transform 0.15s;
  }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .cat-t-teer .submit-btn { background: linear-gradient(135deg, #1e3a5f, #2d6a9f); box-shadow: 0 4px 14px rgba(30,58,95,0.35); }
  .cat-m-teer .submit-btn { background: linear-gradient(135deg, #5f1e3a, #9f2d6a); box-shadow: 0 4px 14px rgba(95,30,58,0.35); }

  /* 成功弹层 */
  .success-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 1000;
    align-items: center; justify-content: center;
  }
  .success-overlay.show { display: flex; }
  .success-card {
    background: white; border-radius: 20px;
    padding: 32px; text-align: center; width: 280px;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .success-icon { font-size: 56px; margin-bottom: 12px; }
  .success-title { font-size: 18px; font-weight: 700; color: #1a202c; }
  .success-sub { font-size: 13px; color: #718096; margin-top: 6px; }
  .success-close {
    margin-top: 20px; padding: 10px 32px;
    background: #1e3a5f; color: white;
    border: none; border-radius: 24px; font-size: 14px;
    cursor: pointer; font-family: inherit;
  }

  /* 二维码弹层 */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 500;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-sheet {
    background: white; width: 100%; max-width: 500px;
    border-radius: 20px 20px 0 0;
    padding: 24px 24px 40px;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-handle { width: 40px; height: 4px; background: #e2e8f0; border-radius: 2px; margin: 0 auto 20px; }
  .modal-title { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 20px; }
  #qrcode-container { text-align: center; }
  .qr-label { font-size: 13px; color: #718096; text-align: center; margin-top: 12px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 500; }
  .modal-btn.primary { background: #1e3a5f; color: white; }
  .modal-btn.secondary { background: #f7fafc; color: #1a202c; }

  /* 空状态 */
  .empty-state { text-align: center; padding: 32px; color: #a0aec0; font-size: 14px; }
  .empty-state .empty-icon { font-size: 40px; margin-bottom: 8px; }

  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); color: white;
    padding: 10px 20px; border-radius: 24px;
    font-size: 14px; z-index: 2000;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  .loading-spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white; border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 快递追踪 */
  .shipping-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
  .shipping-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .shipping-header h3 { font-size: 13px; color: #718096; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; margin: 0; }
  .shipping-status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .shipping-status-badge.in_transit { background: #ebf8ff; color: #2b6cb0; }
  .shipping-status-badge.delivered { background: #f0fff4; color: #276749; }
  .shipping-status-badge.pending { background: #fffaf0; color: #c05621; }
  .shipping-input-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  .shipping-input-row select, .shipping-input-row input {
    border: 1.5px solid #e2e8f0; border-radius: 8px; padding: 8px 10px; font-size: 13px; outline: none; font-family: inherit;
  }
  .shipping-input-row select { width: 110px; flex-shrink: 0; background: white; }
  .shipping-input-row input { flex: 1; min-width: 0; }
  .shipping-btn {
    padding: 8px 16px; border-radius: 8px; border: none; font-size: 13px; cursor: pointer; font-weight: 600; font-family: inherit;
    transition: all 0.15s;
  }
  .shipping-btn:active { transform: scale(0.96); }
  .shipping-btn.bind { background: #2b6cb0; color: white; }
  .shipping-btn.unbind { background: #fff5f5; color: #c53030; margin-left: 8px; }
  .shipping-btn.refresh { background: #ebf8ff; color: #2b6cb0; margin-left: 8px; }
  .shipping-info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .shipping-carrier { font-size: 13px; color: #2d3748; font-weight: 600; background: #edf2f7; padding: 3px 8px; border-radius: 4px; }
  .shipping-no { font-size: 13px; color: #4a5568; font-family: 'SF Mono', 'Consolas', monospace; }
  .shipping-no a { color: #2b6cb0; text-decoration: none; }
  .shipping-no a:hover { text-decoration: underline; }
  .ship-timeline { margin-top: 12px; }
  .ship-tl-item { display: flex; gap: 10px; padding: 8px 0; position: relative; }
  .ship-tl-item::before { content: ''; position: absolute; left: 7px; top: 22px; bottom: -8px; width: 2px; background: #e2e8f0; }
  .ship-tl-item:last-child::before { display: none; }
  .ship-tl-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #cbd5e0; flex-shrink: 0; margin-top: 2px; background: white; }
  .ship-tl-dot.latest { background: #2b6cb0; border-color: #90cdf4; }
  .ship-tl-content { flex: 1; }
  .ship-tl-desc { font-size: 13px; color: #1a202c; }
  .ship-tl-loc { font-size: 12px; color: #718096; margin-top: 2px; }
  .ship-tl-time { font-size: 11px; color: #a0aec0; margin-top: 2px; }
</style>
</head>
<body>

<!-- ===== 页面1：设备列表 ===== -->
<div id="page-list" class="page active">
  <div class="header" id="list-header">
    <h1 id="list-title">🏥 TEER模拟器资产管理</h1>
    <p id="list-subtitle">点击设备卡片查看详情 · 长按弹出二维码</p>
  </div>
  <div class="stats-bar" id="stats-bar"></div>
  <div class="device-list" id="device-list-container"></div>
</div>

<!-- ===== 页面2：设备详情 ===== -->
<div id="page-detail" class="page">
  <div class="detail-header" id="detail-header">
    <button class="back-btn" onclick="goBack('page-list')">← 返回列表</button>
    <div class="detail-device-name" id="detail-name"></div>
    <div class="detail-device-id" id="detail-id"></div>
  </div>
  <div class="detail-body">
    <div class="info-card">
      <h3>📋 基本信息</h3>
      <div class="info-row"><span class="info-label">资产编号</span><span class="info-value" id="d-assetno"></span></div>
      <div class="info-row"><span class="info-label">分类</span><span class="info-value" id="d-category"></span></div>
      <div class="info-row"><span class="info-label">所属区域</span><span class="info-value" id="d-region"></span></div>
      <div class="info-row"><span class="info-label">常规保管位置</span><span class="info-value" id="d-location"></span></div>
      <div class="info-row"><span class="info-label">常规保管人</span><span class="info-value" id="d-owner"></span></div>
      <div class="info-row" id="d-statusnote-row"><span class="info-label">状态备注</span><span class="info-value" id="d-statusnote" style="cursor:pointer;color:#2b6cb0" onclick="editStatusNote()">—</span></div>
    </div>
    <div class="info-card">
      <h3>📡 当前状态</h3>
      <div class="info-row"><span class="info-label">使用状态</span><span class="info-value" id="d-usestatus"></span></div>
      <div class="info-row"><span class="info-label">需要维修</span><span class="info-value" id="d-repair"></span></div>
      <div class="info-row" id="d-presetnote-row" style="display:none"><span class="info-label">备注</span><span class="info-value" id="d-presetnote" style="color:#9b2c2c;font-size:13px"></span></div>
    </div>
    <div class="info-card">
      <h3>🔍 目前状态</h3>
      <div class="info-row"><span class="info-label">扩张鞘</span><span class="info-value" id="d-dilator"></span></div>
      <div class="info-row"><span class="info-label">心脏模型</span><span class="info-value" id="d-heartmodel"></span></div>
      <div class="info-row"><span class="info-label">导引鞘</span><span class="info-value" id="d-guidesheath"></span></div>
      <div class="info-row"><span class="info-label">瓣膜夹</span><span class="info-value" id="d-clip"></span></div>
      <div class="info-row" id="d-clipfunc-row" style="display:none"><span class="info-label">瓣膜夹功能</span><span class="info-value" id="d-clipfunc" style="color:#9b2c2c;font-size:13px"></span></div>
      <div class="info-row"><span class="info-label">检查时间</span><span class="info-value" id="d-checktime"></span></div>
      <div class="info-row" id="d-anomaly-row" style="display:none"><span class="info-label">异常记录</span><span class="info-value" id="d-anomaly" style="color:#c53030"></span></div>
    </div>
    <div class="info-card">
      <h3>📍 位置追踪历史</h3>
      <div class="timeline" id="d-timeline"></div>
    </div>
    <div class="shipping-card" id="shipping-card">
      <div class="shipping-header">
        <h3>📦 快递追踪</h3>
        <span class="shipping-status-badge pending" id="d-ship-badge">未绑定</span>
      </div>
      <div id="shipping-bind-row" class="shipping-input-row">
        <select id="f-ship-carrier">
          <option value="">选择快递</option>
          <option value="shunfeng">顺丰速运</option>
          <option value="zhongtong">中通快递</option>
          <option value="yunda">韵达快递</option>
          <option value="yuantong">圆通速递</option>
          <option value="shentong">申通快递</option>
          <option value="jingdong">京东物流</option>
          <option value="ems">EMS</option>
          <option value="debang">德邦快递</option>

// ============================================================
// IndexedDB 媒体存储（替代 base64 存 localStorage）
// ============================================================
const MEDIA_DB_NAME = "TEER_MediaStore";
const MEDIA_DB_VERSION = 1;
const MEDIA_STORE = "blobs";

function openMediaDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(MEDIA_DB_NAME, MEDIA_DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(MEDIA_STORE)) {
        db.createObjectStore(MEDIA_STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveMediaBlob(id, blob) {
  const db = await openMediaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE, "readwrite");
    tx.objectStore(MEDIA_STORE).put({ id, blob });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getMediaBlob(id) {
  const db = await openMediaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE, "readonly");
    const req = tx.objectStore(MEDIA_STORE).get(id);
    req.onsuccess = () => resolve(req.result ? req.result.blob : null);
    req.onerror = () => reject(req.error);
  });
}

async function deleteMediaBlob(id) {
  const db = await openMediaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE, "readwrite");
    tx.objectStore(MEDIA_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function mediaBlobId(deviceId, index) {
  return `${deviceId}_media_${index}`;
}

// 媒体URL缓存（避免重复创建ObjectURL）
const mediaURLCache = {};

async function getMediaURL(deviceId, index) {
  const key = mediaBlobId(deviceId, index);
  if (mediaURLCache[key]) return mediaURLCache[key];
  const blob = await getMediaBlob(key);
  if (!blob) return null;
  const url = URL.createObjectURL(blob);
  mediaURLCache[key] = url;
  return url;
}

function createDefaultDevices(catKey) {
  const cat = CATEGORIES[catKey];
  const arr = [];
  for (let i = 1; i <= cat.count; i++) {
    const num = String(i).padStart(3, "0");
    const id = `${cat.idPrefix}-${num}`;
    const preset = DEVICE_PRESETS[id] || {};
    arr.push({
      id: id,
      name: `${cat.defaultName} #${i}`,
      icon: cat.icon,
      location: preset.location || "",
      region: preset.region || "",
      owner: preset.owner || "",
      useStatus: preset.status || "",
      needRepair: preset.repair || false,
      presetNote: preset.note || "",
      category: catKey,
      dilator: "",
      heartmodel: "",
      guidesheath: "",
      clip: "",
      clipfunc: [],
      clipfuncOther: "",
      lastCheck: null,
      nextCheck: null,
      anomaly: "",
      logs: [],
      media: []
    });
  }
  return arr;
}

function loadData() {
  try {
    const stored = localStorage.getItem(STORE_KEY);
    if (stored) {
      const all = JSON.parse(stored);
      return all;
    }
  } catch(e) {}
  return null;
}

function saveAllData(allData) {
  localStorage.setItem(STORE_KEY, JSON.stringify(allData));
}

function ensureDevices(catKey) {
  let allData = loadData();
  if (!allData) allData = {};
  if (!allData[catKey]) {
    allData[catKey] = createDefaultDevices(catKey);
    saveAllData(allData);
  } else {
    // 合并固定属性更新（如常规保管人、区域、位置发生变化）
    allData[catKey].forEach(d => {
      const preset = DEVICE_PRESETS[d.id];
      if (preset) {
        d.owner = preset.owner;
        d.region = preset.region;
        d.location = preset.location;
        d.useStatus = preset.status;
        d.needRepair = preset.repair;
        d.presetNote = preset.note;
      }
    });
    saveAllData(allData);
  }
  return allData[catKey];
}

function saveCurrentDevices() {
  let allData = loadData() || {};
  // 清理：保存时去除media中的data字段（base64数据已迁移到IndexedDB）
  const cleanDevices = devices.map(d => {

      clean.media = clean.media.map(m => {

        delete copy.data; // 不存base64到localStorage

  });

}

function getCategoryFromURL() {

  const cat = params.get("cat");
  if (cat && CATEGORIES[cat]) return cat;
  const dev = params.get("device");

  if (dev && dev.startsWith("M-TEER")) return "m-teer";

}

// ============================================================
// 状态工具
// ============================================================
function getStatusClass(dev) {
  if (!dev.dilator && !dev.heartmodel && !dev.guidesheath && !dev.clip) return "status-unchecked";
  const missing = [dev.dilator, dev.heartmodel, dev.guidesheath, dev.clip].filter(v => v === "无").length;
  const hasClipIssue = dev.clip === "有" && dev.clipfunc && dev.clipfunc.length > 0 && !dev.clipfunc.includes("可用");
  if (missing > 0 || hasClipIssue) return "status-error";
  const allHave = [dev.dilator, dev.heartmodel, dev.guidesheath, dev.clip].every(v => v === "有");
  if (allHave) return "status-ok";
  return "status-warn";
}

function getStatusDotClass(dev) {
  if (!dev.dilator && !dev.heartmodel && !dev.guidesheath && !dev.clip) return "";
  const missing = [dev.dilator, dev.heartmodel, dev.guidesheath, dev.clip].filter(v => v === "无").length;
  const hasClipIssue = dev.clip === "有" && dev.clipfunc && dev.clipfunc.length > 0 && !dev.clipfunc.includes("可用");
  if (missing > 0 || hasClipIssue) return "error";
  const allHave = [dev.dilator, dev.heartmodel, dev.guidesheath, dev.clip].every(v => v === "有");
  if (allHave) return "ok";
  return "warn";
}

function getStatusText(dev) {
  if (!dev.dilator && !dev.heartmodel && !dev.guidesheath && !dev.clip) return "尚未检查";
  const parts = [];
  if (dev.dilator === "无") parts.push("⚠️扩张鞘缺失");
  if (dev.heartmodel === "无") parts.push("⚠️心脏模型缺失");
  if (dev.guidesheath === "无") parts.push("⚠️导引鞘缺失");
  if (dev.clip === "无") parts.push("⚠️瓣膜夹缺失");
  if (dev.clip === "有" && dev.clipfunc && dev.clipfunc.length > 0 && !dev.clipfunc.includes("可用")) parts.push("⚠️瓣膜夹功能异常");
  return parts.length > 0 ? parts.join(" · ") : "✅ 器件齐全功能正常";
}

function statusBadge(status) {
  const map = {
    "齐全": `<span class="status-badge badge-ok">✅ 齐全</span>`,
    "正常": `<span class="status-badge badge-ok">✅ 正常</span>`,
    "缺失": `<span class="status-badge badge-error">❌ 缺失</span>`,
    "异常": `<span class="status-badge badge-error">❌ 异常</span>`,
    "unchecked": `<span class="status-badge badge-unchecked">⏳ 待检查</span>`
  };
  return map[status] || `<span class="status-badge badge-unchecked">${status}</span>`;
}

}

  yuantong: "圆通速递", shentong: "申通快递", jingdong: "京东物流",
  ems: "EMS", debang: "德邦快递", tiantian: "天天快递", huitongkuaidi: "百世快递"
};
const CARRIER_TRACK_URLS = {
  shunfeng: "https://www.sf-express.com/sf-service-owf-web/service/rate/onewayDomestic/search?keyword={no}",
  zhongtong: "https://www.zto.com/search?billCode={no}",
  yunda: "https://www.yundaex.com/cxbill.php?fkcod={no}",
  yuantong: "https://www.yto.net.cn/html/search/{no}",
  shentong: "https://www.sto.cn/search?billCode={no}",
  jingdong: "https://www.jd.com/logistics/{no}",
  ems: "https://www.ems.com.cn/query/{no}",
  debang: "https://www.deppon.com/query/{no}",
  tiantian: "https://www.ttkdex.com/search/{no}",
  huitongkuaidi: "https://www.htky365.com/search/{no}"
};

// API代理地址（后续部署后替换）
const TRACKING_API = "https://teer-tracking-api.vercel.app/api/track";

function renderShipping(device) {
  const bindRow = document.getElementById("shipping-bind-row");
  const infoRow = document.getElementById("shipping-info-row");
  const badge = document.getElementById("d-ship-badge");
  const timeline = document.getElementById("d-ship-timeline");

  if (!device.shipping || !device.shipping.trackingNo) {
    bindRow.style.display = "flex";
    infoRow.style.display = "none";
    badge.className = "shipping-status-badge pending";
    badge.textContent = "未绑定";
    timeline.innerHTML = "";
    return;
  }

  bindRow.style.display = "none";
  infoRow.style.display = "block";

  const s = device.shipping;
  document.getElementById("d-ship-carrier").textContent = CARRIER_NAMES[s.carrier] || s.carrier;
  const trackUrl = (CARRIER_TRACK_URLS[s.carrier] || "").replace("{no}", s.trackingNo);
  document.getElementById("d-ship-no").innerHTML = trackUrl
    ? `<a href="${trackUrl}" target="_blank" rel="noopener">${s.trackingNo} ↗</a>`
    : s.trackingNo;

  // 状态badge
  if (s.status === "delivered") {
    badge.className = "shipping-status-badge delivered";
    badge.textContent = "已签收";
  } else if (s.status === "in_transit") {
    badge.className = "shipping-status-badge in_transit";
    badge.textContent = "运输中";
  } else {
    badge.className = "shipping-status-badge pending";
    badge.textContent = "已绑定";
  }

  // 物流时间线
  if (s.timeline && s.timeline.length > 0) {
    timeline.innerHTML = s.timeline.map((t, i) => `
      <div class="ship-tl-item">
        <div class="ship-tl-dot ${i === 0 ? 'latest' : ''}"></div>
        <div class="ship-tl-content">
          <div class="ship-tl-desc">${t.desc || t.status || ""}</div>
          <div class="ship-tl-loc">${t.location || ""}</div>
          <div class="ship-tl-time">${t.time || ""}</div>
        </div>
      </div>
    `).join("");
  } else {
    timeline.innerHTML = `<div style="text-align:center;color:#a0aec0;font-size:13px;padding:12px 0">点击"更新物流"获取最新状态</div>`;
  }
}

function bindShipping() {
  const carrier = document.getElementById("f-ship-carrier").value;
  const trackingNo = document.getElementById("f-ship-no").value.trim();
  if (!carrier) { showToast("请选择快递公司"); return; }
  if (!trackingNo) { showToast("请输入快递单号"); return; }

  currentDevice.shipping = {
    carrier: carrier,
    trackingNo: trackingNo,
    status: "in_transit",
    bindTime: new Date().toLocaleString("zh-CN"),
    timeline: []
  };
  saveCurrentDevices();
  renderShipping(currentDevice);
  showToast("快递单号已绑定");

  // 自动查询物流
  refreshTracking();
}

function unbindShipping() {
  if (!confirm("确定解绑快递单号？物流记录将清除。")) return;
  delete currentDevice.shipping;
  document.getElementById("f-ship-carrier").value = "";
  document.getElementById("f-ship-no").value = "";
  saveCurrentDevices();
  renderShipping(currentDevice);
  showToast("已解绑");
}

async function refreshTracking() {
  if (!currentDevice.shipping) return;
  const s = currentDevice.shipping;
  const badge = document.getElementById("d-ship-badge");
  badge.className = "shipping-status-badge in_transit";
  badge.textContent = "查询中…";

  try {
    const resp = await fetch(`${TRACKING_API}?carrier=${encodeURIComponent(s.carrier)}&no=${encodeURIComponent(s.trackingNo)}`);
    if (!resp.ok) throw new Error("API请求失败");
    const data = await resp.json();

    if (data.timeline && data.timeline.length > 0) {
      s.timeline = data.timeline;
      s.status = data.status || "in_transit";
      s.lastUpdate = new Date().toLocaleString("zh-CN");
      saveCurrentDevices();
      renderShipping(currentDevice);
      showToast("物流已更新");
    } else {
      renderShipping(currentDevice);
      showToast("暂无物流信息");
    }
  } catch (e) {
    // API不可用时，尝试使用快递100网页查询
    console.warn("Tracking API error:", e);
    badge.className = "shipping-status-badge in_transit";
    badge.textContent = "运输中";
    const trackUrl = `https://www.kuaidi100.com/chaxun?nu=${encodeURIComponent(s.trackingNo)}`;
    showToast("API暂不可用，点击单号到官网查询");
    s.timeline = s.timeline || [];
    renderShipping(currentDevice);
  }
}

function renderTimeline(device, cat) {
  const container = document.getElementById("d-timeline");
  if (!device.logs || device.logs.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">📍</div>暂无位置记录</div>`;
    return;
  }
  const sorted = [...device.logs].reverse();
  container.innerHTML = sorted.map(log => `
    <div class="timeline-item ${cat.catClass}">
      <div class="tl-dot"></div>
      <div class="tl-content">
        <div class="tl-location">📍 ${log.location || "位置未记录"}</div>
        <div class="tl-time">${log.time}</div>
        <div class="tl-checker">检查人：${log.checker || "—"}</div>
        <div class="tl-status">${log.dilator ? `扩张鞘:${log.dilator} · 心脏模型:${log.heartmodel} · 导引鞘:${log.guidesheath} · 瓣膜夹:${log.clip}` : ''}${log.clipfunc && log.clipfunc.length > 0 ? `<br>瓣膜夹功能：${log.clipfunc.join('、')}` : ''}</div>
      </div>
    </div>`).join('');
}

async function renderMedia(device) {
  const container = document.getElementById("d-media");
  if (!device.media || device.media.length === 0) {
    container.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📷</div>暂无媒体记录</div>`;
    return;
  }
  // 逐个加载媒体URL
  const items = [];
  for (let i = 0; i < device.media.length; i++) {
    const m = device.media[i];
    let url = null;
    // 兼容旧数据：如果还有data字段（base64），直接用
    if (m.data) {
      url = m.data;
    } else if (m.blobKey) {
      url = await getMediaURL(device.id, i);
    }
    if (!url) { items.push(`<div class="media-thumb"><div style="display:flex;align-items:center;justify-content:center;height:100%;color:#a0aec0;font-size:12px;">加载失败</div></div>`); continue; }
    if (m.type === "video") {
      items.push(`<div class="media-thumb" onclick="viewMedia(${i})"><video src="${url}" muted playsinline></video><div class="video-overlay">▶</div><div class="media-date"><span class="media-time">${m.time || ''}</span>${m.checker ? `<span class="media-checker">${m.checker}</span>` : ''}</div></div>`);
    } else {
      items.push(`<div class="media-thumb" onclick="viewMedia(${i})"><img src="${url}" alt="检查图片"><div class="media-date"><span class="media-time">${m.time || ''}</span>${m.checker ? `<span class="media-checker">${m.checker}</span>` : ''}</div></div>`);
    }
  }
  container.innerHTML = items.join('');
}

async function viewMedia(index) {
  if (!currentDevice || !currentDevice.media[index]) return;
  const m = currentDevice.media[index];
  let url = m.data || null;
  if (!url && m.blobKey) {
    const blob = await getMediaBlob(m.blobKey);
    if (blob) url = URL.createObjectURL(blob);
  }
  if (!url) { showToast("无法加载媒体"); return; }
  const win = window.open();
  win.document.write(`<style>body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;}</style>${m.type === "video" ? `<video src="${url}" controls autoplay style="max-width:100%;max-height:100vh;"></video>` : `<img src="${url}" style="max-width:100%;max-height:100vh;">`}`);
}

  if (!hasClip) {

// 多选切换（瓣膜夹功能检查）
const checkSelections = {};
function toggleCheck(btn) {
  const group = btn.dataset.group;
  if (!checkSelections[group]) checkSelections[group] = [];
  const val = btn.dataset.val;
  const idx = checkSelections[group].indexOf(val);
  if (idx >= 0) {
    checkSelections[group].splice(idx, 1);
    btn.classList.remove("selected", btn.dataset.cls);
  } else {
    checkSelections[group].push(val);
    btn.classList.add("selected", btn.dataset.cls);
  }
  radioSelections[group] = checkSelections[group] || [];
  // "其他"显示输入框
  const otherRow = document.getElementById("clipfunc-other-row");
  if (checkSelections[group].includes("其他")) {
    otherRow.style.display = "block";
  } else {
    otherRow.style.display = "none";
  }
}

function handleFileSelect(event) {
  Array.from(event.target.files).forEach(file => {
    if (file.size > MAX_FILE_SIZE) { showToast("文件超过500MB限制"); return; }
    const isVideo = file.type.startsWith("video");
    const blobUrl = URL.createObjectURL(file);
    selectedFiles.push({ file, blobUrl, type: isVideo ? "video" : "image" });
    renderUploadPreview();
  });
  event.target.value = "";
}

function renderUploadPreview() {
  document.getElementById("upload-preview").innerHTML = selectedFiles.map((f, i) => `
    <div class="preview-item">
      ${f.type === "video" ? `<video src="${f.blobUrl}" muted></video>` : `<img src="${f.blobUrl}" alt="预览">`}
      <div class="preview-type">${f.type === "video" ? "视频" : "图片"}</div>
      <button class="remove-btn" onclick="removeFile(${i})">✕</button>
    </div>`).join('');
}

function removeFile(index) { selectedFiles.splice(index, 1); renderUploadPreview(); }

async function submitCheck() {
  const checker = document.getElementById("f-checker").value.trim();
  const location = document.getElementById("f-location").value.trim();
  const dilator = radioSelections["dilator"];
  const heartmodel = radioSelections["heartmodel"];
  const guidesheath = radioSelections["guidesheath"];
  const clip = radioSelections["clip"];
  const clipfunc = radioSelections["clipfunc"] || [];
  if (!checker) { showToast("请填写检查人姓名"); return; }
  if (!location) { showToast("请填写当前位置"); return; }
  if (!dilator || !heartmodel || !guidesheath || !clip) { showToast("请完成所有器件检查"); return; }
  if (clip === "有" && clipfunc.length === 0) { showToast("请选择瓣膜夹功能状态"); return; }

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.innerHTML = `<span class="loading-spinner"></span> 提交中...`;

  const now = new Date();
  const timeStr = now.toLocaleString("zh-CN", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
  const nextDate = "";
  const clipfuncOther = document.getElementById("f-clipfunc-other") ? document.getElementById("f-clipfunc-other").value.trim() : "";
  const note = document.getElementById("f-note").value.trim();

  // 构建异常记录
  const anomalyParts = [];
  if (dilator === "无") anomalyParts.push("扩张鞘：无");
  if (heartmodel === "无") anomalyParts.push("心脏模型：无");
  if (guidesheath === "无") anomalyParts.push("导引鞘：无");
  if (clip === "无") anomalyParts.push("瓣膜夹：无");
  if (clip === "有" && clipfunc.length > 0) {
    const funcLabels = clipfunc.map(v => v === "其他" && clipfuncOther ? "其他：" + clipfuncOther : v);
    anomalyParts.push("瓣膜夹功能：" + funcLabels.join("、"));
  }

  // 保存媒体到IndexedDB，localStorage只存引用
  const mediaStartIdx = (currentDevice.media || []).length;
  const mediaRecords = [];
  for (let fi = 0; fi < selectedFiles.length; fi++) {
    const f = selectedFiles[fi];
    const blobIdx = mediaStartIdx + fi;
    const blobKey = mediaBlobId(currentDevice.id, blobIdx);
    // 将文件转为Blob存入IndexedDB
    const fileBlob = f.file;
    await saveMediaBlob(blobKey, fileBlob);
    mediaRecords.push({ type: f.type, time: timeStr, checker, blobKey });
  }
  const logEntry = { time: timeStr, checker, location, dilator, heartmodel, guidesheath, clip, clipfunc, clipfuncOther, nextCheck: nextDate, note, mediaCount: mediaRecords.length };

  currentDevice.location = location;
  currentDevice.owner = currentDevice.owner || checker;
  currentDevice.dilator = dilator;
  currentDevice.heartmodel = heartmodel;
  currentDevice.guidesheath = guidesheath;
  currentDevice.clip = clip;
  currentDevice.clipfunc = clipfunc;
  currentDevice.clipfuncOther = clipfuncOther;
  currentDevice.lastCheck = timeStr;
  currentDevice.nextCheck = nextDate;
  currentDevice.anomaly = anomalyParts.join("\n") || "";
  currentDevice.logs = currentDevice.logs || [];
  currentDevice.logs.push(logEntry);
  currentDevice.media = (currentDevice.media || []).concat(mediaRecords);

  saveCurrentDevices();

  await new Promise(r => setTimeout(r, 800));
  btn.disabled = false;
  btn.innerHTML = "提交检查记录";
  document.getElementById("success-sub").textContent = `已记录 ${timeStr} 的检查数据`;
  document.getElementById("success-overlay").classList.add("show");
}

function afterSubmit() {
  document.getElementById("success-overlay").classList.remove("show");
  openDetail(currentDevice.id);
}

}

let longPressTimer = null;
function handleLongPress(id) { longPressTimer = setTimeout(() => showQRModal(id), 600); }
function cancelLongPress() { if (longPressTimer) clearTimeout(longPressTimer); }

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}

// ============================================================
// 初始化
// ============================================================
function init() {
  const catKey = getCategoryFromURL();
  if (!catKey) {
    // 没有分类参数 → 显示选择页
    document.getElementById("page-list").innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:32px;text-align:center">
        <div style="font-size:48px;margin-bottom:16px">🏥</div>
        <h2 style="font-size:20px;font-weight:700;margin-bottom:8px">TEER模拟器资产管理</h2>
        <p style="font-size:14px;color:#718096;margin-bottom:32px">请选择管理分类</p>
        <a href="?cat=t-teer" style="display:block;width:240px;padding:18px;margin-bottom:16px;background:linear-gradient(135deg,#1e3a5f,#2d6a9f);color:white;border-radius:14px;text-decoration:none;font-size:16px;font-weight:600;box-shadow:0 4px 14px rgba(30,58,95,0.35)">🏥 T-TEER模拟器</a>
        <a href="?cat=m-teer" style="display:block;width:240px;padding:18px;margin-bottom:16px;background:linear-gradient(135deg,#5f1e3a,#9f2d6a);color:white;border-radius:14px;text-decoration:none;font-size:16px;font-weight:600;box-shadow:0 4px 14px rgba(95,30,58,0.35)">📊 M-TEER模拟器</a>
        <p style="font-size:12px;color:#a0aec0;margin-top:16px">扫描设备二维码可直接进入对应分类</p>
      </div>`;
    document.getElementById("page-list").classList.add("active");
    return;
  }

  currentCat = catKey;
  devices = ensureDevices(catKey);
  renderDeviceList();

  // 检查是否直接跳转设备
  const params = new URLSearchParams(window.location.search);
  const deviceId = params.get("device");
  const action = params.get("action");
  if (deviceId) {
    const dev = devices.find(d => d.id === deviceId);
    if (dev) {
      openDetail(deviceId);
      // 实物标签码扫码 → 自动打开检查表单
      if (action === "inspect") {
        setTimeout(() => goToCheckForm(), 300);
      }
      return;
    }
  }

  showPage("page-list");
}

init();
</script>
