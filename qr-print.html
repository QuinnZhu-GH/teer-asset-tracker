<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEER模拟器二维码打印册</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f5f5f5; padding: 20px;
  }
  .print-controls {
    background: white; border-radius: 12px; padding: 20px;
    margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .print-controls h1 { font-size: 18px; color: #1a202c; }
  .print-controls p { font-size: 13px; color: #718096; margin-top: 4px; }
  .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    padding: 10px 20px; border-radius: 8px; border: none;
    font-size: 14px; cursor: pointer; font-family: inherit;
    font-weight: 500; transition: all 0.15s;
  }
  .btn-primary { background: #1e3a5f; color: white; }
  .btn-primary:hover { background: #2d6a9f; }
  .btn-secondary { background: #edf2f7; color: #1a202c; }

  .url-input-wrap {
    background: white; border-radius: 12px; padding: 16px 20px;
    margin-bottom: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  }
  .url-input-wrap label { font-size: 13px; color: #718096; display: block; margin-bottom: 8px; }
  .url-input-wrap input {
    width: 100%; padding: 10px 12px;
    border: 1.5px solid #e2e8f0; border-radius: 8px;
    font-size: 14px; outline: none; font-family: monospace;
  }
  .url-input-wrap input:focus { border-color: #2d6a9f; }
  .url-note { font-size: 12px; color: #a0aec0; margin-top: 6px; }

  /* 分类标题 */
  .section-title {
    font-size: 15px; font-weight: 700; margin: 24px 0 12px;
    padding-left: 4px; display: flex; align-items: center; gap: 8px;
  }
  .section-title.t-teer { color: #1e3a5f; }
  .section-title.m-teer { color: #5f1e3a; }
  .section-title .badge {
    font-size: 11px; font-weight: 500; padding: 2px 8px;
    border-radius: 10px; color: white;
  }
  .section-title.t-teer .badge { background: #1e3a5f; }
  .section-title.m-teer .badge { background: #5f1e3a; }

  /* 二维码网格 */
  .qr-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }

  /* 极简二维码卡片 */
  .qr-card {
    background: white; border-radius: 10px;
    padding: 16px; text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    border: 1px solid #e2e8f0;
  }

  /* QR码容器 - 支持中心文字覆盖 */
  .qr-code-wrap {
    display: flex; justify-content: center;
    margin: 0 auto; position: relative;
  }
  .qr-center-label {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.3px;
    pointer-events: none;
    z-index: 2;
    white-space: nowrap;
  }
  .qr-center-label.t-teer { color: #1e3a5f; }
  .qr-center-label.m-teer { color: #5f1e3a; }

  /* 线上监测码 - 稍大 */
  .monitor-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }
  .monitor-card {
    background: white; border-radius: 12px;
    padding: 20px; text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border: 2px solid #e2e8f0;
  }
  .monitor-card.t-teer { border-color: #1e3a5f; }
  .monitor-card.m-teer { border-color: #5f1e3a; }
  .monitor-label {
    font-size: 13px; font-weight: 600; margin-bottom: 10px;
  }
  .monitor-label.t-teer { color: #1e3a5f; }
  .monitor-label.m-teer { color: #5f1e3a; }
  .monitor-hint {
    font-size: 11px; color: #a0aec0; margin-top: 8px;
  }

  @media print {
    body { background: white; padding: 0; }
    .print-controls, .url-input-wrap { display: none; }
    .qr-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .monitor-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .qr-card { padding: 10px; break-inside: avoid; page-break-inside: avoid; }
    .monitor-card { break-inside: avoid; page-break-inside: avoid; }
    .section-title { margin: 16px 0 8px; }
  }
</style>
</head>
<body>

<div class="print-controls">
  <div>
    <h1>TEER模拟器二维码打印册</h1>
    <p>实物标签码 · 线上监测码</p>
  </div>
  <div class="btn-group">
    <button class="btn btn-secondary" onclick="generateAll()">刷新二维码</button>
    <button class="btn btn-primary" onclick="window.print()">打印全部</button>
  </div>
</div>

<div class="url-input-wrap">
  <label>H5系统访问地址</label>
  <input type="url" id="base-url" placeholder="例如：https://your-name.github.io/teer-asset-tracker/" value="https://quinnzhu-gh.github.io/teer-asset-tracker/index.html">
  <div class="url-note">二维码中嵌入URL参数，扫码后自动跳转对应页面</div>
</div>

<!-- 实物标签码 -->
<div class="section-title t-teer">实物标签码 · T-TEER <span class="badge">贴设备</span></div>
<div class="qr-grid" id="asset-grid-t-teer"></div>

<div class="section-title m-teer">实物标签码 · M-TEER <span class="badge">贴设备</span></div>
<div class="qr-grid" id="asset-grid-m-teer"></div>

<!-- 线上监测码 -->
<div class="section-title t-teer" style="margin-top:32px;">线上监测码 <span class="badge">远程管理</span></div>
<div class="monitor-grid" id="monitor-grid"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const CATEGORIES = {
  "t-teer": {
    key: "t-teer", label: "T-TEER", color: "#1e3a5f", count: 2, idPrefix: "T-TEER"
  },
  "m-teer": {
    key: "m-teer", label: "M-TEER", color: "#5f1e3a", count: 14, idPrefix: "M-TEER"
  }
};

function getBaseUrl() {
  let url = document.getElementById("base-url").value.trim();
  if (!url) url = window.location.href.replace("qr-print.html", "index.html");
  return url.split("?")[0];
}

function generateAssetCodes(catKey) {
  const cat = CATEGORIES[catKey];
  const grid = document.getElementById(`asset-grid-${catKey}`);
  grid.innerHTML = "";

  for (let i = 1; i <= cat.count; i++) {
    const num = String(i).padStart(3, "0");
    const deviceId = `${cat.idPrefix}-${num}`;
    const url = `${getBaseUrl()}?cat=${catKey}&device=${deviceId}&action=inspect`;

    const card = document.createElement("div");
    card.className = "qr-card";

    // QR码容器 + 中心文字
    const wrapId = `asset-qr-${deviceId}`;
    card.innerHTML = `
      <div class="qr-code-wrap">
        <div id="${wrapId}"></div>
        <div class="qr-center-label ${catKey}">${deviceId}</div>
      </div>
    `;
    grid.appendChild(card);

    // 使用H级纠错（30%容错），确保中心覆盖文字后仍可扫描
    new QRCode(document.getElementById(wrapId), {
      text: url,
      width: 130, height: 130,
      colorDark: cat.color,
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  }
}

function generateMonitorCodes() {
  const grid = document.getElementById("monitor-grid");
  grid.innerHTML = "";

  Object.values(CATEGORIES).forEach(cat => {
    const url = `${getBaseUrl()}?cat=${cat.key}`;

    const card = document.createElement("div");
    card.className = `monitor-card ${cat.key}`;

    const wrapId = `monitor-qr-${cat.key}`;
    card.innerHTML = `
      <div class="monitor-label ${cat.key}">${cat.label} 全部设备</div>
      <div class="qr-code-wrap">
        <div id="${wrapId}"></div>
        <div class="qr-center-label ${cat.key}">${cat.label}</div>
      </div>
      <div class="monitor-hint">扫码查看${cat.label}所有设备状态</div>
    `;
    grid.appendChild(card);

    new QRCode(document.getElementById(wrapId), {
      text: url,
      width: 150, height: 150,
      colorDark: cat.color,
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  });
}

function generateAll() {
  generateAssetCodes("t-teer");
  generateAssetCodes("m-teer");
  generateMonitorCodes();
}

generateAll();
</script>
</body>
</html>
